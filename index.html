<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Počítací hrdinové</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2b2340; --muted:#7a7090;
  --pri:#6c4cf5; --pri2:#8f78ff; --ok:#1fae6b; --bad:#ec5050; --gold:#f5b400;
  --line:#efe6d6; --soft:#f4efff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:24px;margin:0;font-weight:900;flex:1}
h3{margin:22px 0 8px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn{background:var(--pri);color:#fff;border-radius:16px;padding:14px 22px;font-size:18px;box-shadow:0 4px 0 #4a2fc4;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a2fc4}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #13804d}
.btn.red{background:#d9443a;box-shadow:0 4px 0 #9b2a22}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 #b88700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 14px;font-size:15px;border-radius:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.profile{cursor:pointer;text-align:center;transition:transform .1s;position:relative}
.profile:hover{transform:translateY(-3px)}
.profile h2{margin:4px 0 2px;font-size:22px}
.profile .lock{position:absolute;top:12px;right:14px;font-size:18px}
.sub{color:var(--muted);font-size:15px}
.status{margin-top:8px;font-size:15px}
.status.done{color:var(--ok)}
.newhero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;border-style:dashed;color:var(--muted);font-size:20px}
.newhero b{font-size:56px;color:var(--pri)}
.hero svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.bar{height:14px;background:#f0eadf;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .4s}
.bar.gold > i{background:linear-gradient(90deg,#f5b400,#ffd84d)}
.bar.hp > i{background:linear-gradient(90deg,#1fae6b,#5ad69a)}
.bar.mhp > i{background:linear-gradient(90deg,#d9443a,#f27a6f)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stat{background:#faf6ef;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:17px;white-space:nowrap}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.testbanner{background:#e7f6ff;border:2px dashed #5aa9e6;color:#1d5f91;border-radius:16px;padding:10px 14px;margin-bottom:12px}
/* practice */
.prob{font-size:clamp(36px,8.5vw,60px);font-weight:900;text-align:center;margin:14px 0 6px;letter-spacing:1px;line-height:1.25}
.prob.mid{font-size:clamp(24px,5.5vw,38px);line-height:1.35}
.prob.word{font-size:clamp(20px,4.5vw,28px);font-weight:800;line-height:1.4;text-align:left}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.6em;line-height:1;margin:0 4px}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.ansrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ans{font-family:inherit;font-weight:900;font-size:38px;width:180px;text-align:center;border:3px solid var(--line);border-radius:18px;padding:6px;background:#fff;color:var(--ink);outline:none}
.ans.sm{width:110px}
.ans.active{border-color:var(--pri);box-shadow:0 0 0 4px #e6e0ff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:12px auto 0}
.pad button{font-size:26px;padding:12px 0;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .go{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 0 #13804d}
.cmpbtns{display:flex;justify-content:center;gap:14px;margin-top:10px}
.cmpbtns button{font-size:42px;width:92px;height:92px;border-radius:22px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;background:#ece4d6;display:block}
.dots i.c{background:var(--ok)} .dots i.h{background:#9ad7b6} .dots i.w{background:var(--bad)} .dots i.cur{outline:3px solid var(--pri);outline-offset:1px}
.fb{min-height:34px;text-align:center;font-size:21px;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
/* gear */
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.slot{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.slot h4{margin:0;font-size:16px;display:flex;justify-content:space-between}
.slot .eqd{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#faf6ef;border-radius:12px;padding:6px 10px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.new{animation:glow 1.2s infinite;border-color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 0 5px #ffe28a}}
.buy{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
/* map & battle */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;cursor:pointer;position:relative}

.mcard.locked{cursor:default;background:#f3efe8}

.mcard.beaten{border-color:#9ad7b6;background:#f2fbf6}
.mcard.next{border-color:var(--pri);box-shadow:0 0 0 4px #e6e0ff}
.mcard .num{z-index:3;background:rgba(255,255,255,.85);border-radius:8px;padding:0 5px;position:absolute;top:8px;left:10px;font-size:13px;color:var(--muted)}
.mcard .badge{z-index:3;position:absolute;top:6px;right:8px;font-size:20px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;background:linear-gradient(#e9f4ff,#fdf6e8);border:2px solid var(--line);border-radius:22px;padding:12px}
.fighter{position:relative;text-align:center}
.fighter svg{width:100%;max-width:200px;height:auto}
.fighter .nm{font-size:16px;margin-top:4px}
.vs{font-size:34px;font-weight:900;color:var(--muted);align-self:center}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#d9443a;animation:up 1s forwards;pointer-events:none;text-shadow:0 2px 0 #fff}
.dmg.miss{color:#7a7090}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.hitme{animation:shake .4s}
.lunge{animation:lunge .4s}
@keyframes lunge{50%{transform:translateX(30px)}}
.lungeL{animation:lungeL .4s}
@keyframes lungeL{50%{transform:translateX(-30px)}}
.analysis{border-radius:16px;padding:12px 14px;font-size:17px;margin-top:10px}
.analysis.good{background:#e9f8f0;color:#13804d}
.analysis.tight{background:#fff6dc;color:#8a6200}
.analysis.bad{background:#fdecec;color:#a8322a}

/* art & animation */
.hb{animation:breath 3.2s ease-in-out infinite;transform-origin:105px 236px}
@keyframes breath{50%{transform:translateY(-1.6px) scaleY(1.006)}}
.hc{animation:sway 4.5s ease-in-out infinite;transform-origin:105px 100px}
@keyframes sway{50%{transform:skewX(2.5deg)}}
.pet{animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-7px)}}
.mb{animation:mbreath 2.6s ease-in-out infinite;transform-origin:100px 190px}
@keyframes mbreath{50%{transform:scale(1.02,.985)}}
.stage{background:radial-gradient(ellipse 60% 14% at 50% 92%,#cfe8b8 0 98%,transparent 100%),linear-gradient(#e6f3ff,#fdf8ee 75%);border-radius:18px}
.arena{position:relative;overflow:hidden;background:#222}
.arena > .scene, .mpic > .scene{position:absolute;inset:0;width:100%;height:100%}
.arena .fighter{z-index:1}
.arena .fighter .nm,.arena .fighter .sub{background:rgba(255,255,255,.88);border-radius:10px;padding:1px 8px;display:inline-block}
.arena .fighter .bar{background:rgba(255,255,255,.8)}
.arena .vs{z-index:1;color:#fff;text-shadow:0 2px 6px #000}
.mpic{position:relative;border-radius:12px;overflow:hidden;height:130px;margin-bottom:6px}
.mpic .mon{position:relative;z-index:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.mpic .mon svg{height:118px;width:auto;max-width:none}
.mcard.locked .mpic .mon svg{filter:brightness(0) opacity(.55)}
.mcard.locked .mpic .scene{filter:grayscale(1) brightness(.6)}
.prestage{position:relative;border-radius:16px;overflow:hidden;max-width:300px;margin:0 auto}
.prestage .mon{position:relative;z-index:1}
.prestage > .scene{position:absolute;inset:0;width:100%;height:100%}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.modebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:16px;background:#fff;border:2px solid var(--line);color:var(--ink);text-align:center}
.modebtn small{font-weight:600;color:var(--muted);font-size:12px}
.modebtn.on{border-color:var(--pri);background:#f4efff;box-shadow:0 0 0 3px #e6e0ff}
.species{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:640px){.species{grid-template-columns:repeat(3,1fr)}}
.spbtn{display:flex;flex-direction:column;align-items:center;padding:4px;border-radius:14px;background:#fff;border:2px solid var(--line);color:var(--ink);font-size:13px}
.spbtn svg{width:100%;height:auto}
.spbtn.on{border-color:var(--pri);background:#f4efff}
.stage.roomstage svg, .roomthumb svg{max-width:100%!important;width:100%}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:10px auto 0}
.choices.n2{grid-template-columns:repeat(2,1fr);max-width:520px}
.choices.n3{grid-template-columns:repeat(3,1fr);max-width:460px}
@media (max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}}
.choice{min-height:96px;border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:8px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice.wrong{opacity:.35;border-color:#f3b4b4}
.choice svg{max-width:70px;height:auto}
.emo{line-height:1;display:inline-block}
.num0{font-size:44px;font-weight:900}
.many{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;margin:0 auto}
.many.sm{gap:2px;max-width:150px}
.pic0{text-align:center;margin:6px 0 4px}
.say{background:#eef6ff;border:2px solid #bcdcff;border-radius:12px;font-size:22px;padding:2px 8px;vertical-align:middle;margin-left:6px}
.inlinechoice svg{width:34px;height:34px;vertical-align:middle}
.inlinechoice .emo{font-size:30px!important}
.inlinechoice .many{display:inline-flex}
@media (max-width:520px){.top h1{font-size:19px}.top .pill{font-size:13px;padding:5px 10px;max-width:46vw;overflow:hidden;text-overflow:ellipsis}.top .btn.small{padding:7px 10px;font-size:14px}}
/* parent */
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{font-family:inherit;font-weight:700;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;padding:3px 0}
.chk input{width:20px;height:20px}
.tabs{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:15px;color:var(--ink)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
table.hist{width:100%;border-collapse:collapse;font-size:15px}
table.hist td,table.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.reward{background:linear-gradient(135deg,#fff3c4,#ffe08a);border:3px solid #f5c842;border-radius:22px;padding:20px;text-align:center}
.reward h2{margin:4px 0;font-size:28px}
.fame{width:100%;border-collapse:collapse;font-size:16px}
.fame td{padding:7px 8px;border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(30,20,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.conf{position:fixed;top:-20px;font-size:28px;z-index:70;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.syncnote{font-size:13px;color:var(--muted);text-align:center;margin-top:20px}
.colors button{width:36px;height:36px;border-radius:50%}
</style>
<style>

/* ===== Herní vzhled ve stylu 3 (dřevo, pergamen, zlato) ===== */
:root{ --ink:#3b2412; --muted:#7a5a3a; --wood:#7a4a22; --wood2:#5a3415; --gold:#f2c230; --gold2:#b8860b; --parch:#fbf0d4; --parch2:#f0dcae; }
html{background:#7cc456;min-height:100%}
body{min-height:100vh}
body{background:
  radial-gradient(ellipse 120% 40% at 50% 100%, #6fbf4f 0 60%, transparent 61%),
  linear-gradient(#8fd3ff 0%, #c9ecff 45%, #a9dc7a 46%, #7cc456 100%) fixed;
  color:var(--ink)}
.wrap{max-width:980px}
h1,h2,h3,.top h1,.prob,.btn,.stat,.pill,.mcard b,.slot h4,.tabs button,.reward h2{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:.3px}
h3{color:#fff;text-shadow:0 2px 0 #5a3415,0 0 6px rgba(0,0,0,.35);font-size:24px}
/* top bar = wooden plank */
.top{background:linear-gradient(#a0662f,#7a4a22 55%,#6a3d18);border:3px solid #4a2a0e;border-radius:18px;padding:8px 10px;
  box-shadow:inset 0 0 0 2px #e8b04a,inset 0 3px 0 rgba(255,255,255,.25),0 5px 0 #3e220a;margin-bottom:16px}
.top h1{color:#fff3c8;text-shadow:0 2px 0 #3e220a;font-size:26px}
.pill{background:linear-gradient(#5a3415,#3e220a);color:#ffe9a8;border:2px solid #e8b04a;box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
/* parchment panels with golden frame */
.card{background:linear-gradient(#fff8e3,var(--parch) 40%,var(--parch2));border:4px solid #8a5a2b;border-radius:20px;
  box-shadow:inset 0 0 0 3px #e8c06a,inset 0 0 18px rgba(138,90,43,.25),0 6px 0 #5e3a17,0 10px 18px rgba(0,0,0,.18)}
.muted,.sub{color:#7a5a3a}
/* glossy game buttons */
.btn{position:relative;color:#fff;border:3px solid #2e1460;border-radius:16px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(#b48cff,#7a46e8 50%,#5d2fc9);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 #2e1460}
.btn:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 2px 0 #2e1460}
.btn.red{background:linear-gradient(#ff8a7a,#e5432f 50%,#c22d1c);border-color:#6e140b;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 #6e140b}
.btn.gold{background:linear-gradient(#ffe680,#f5b800 50%,#d99a00);border-color:#7a5200;color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.12),0 5px 0 #7a5200}
.btn.ok{background:linear-gradient(#8ff0a0,#2fbf5a 50%,#1f9a45);border-color:#0c5a24;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.15),0 5px 0 #0c5a24}
.btn.sec{background:linear-gradient(#fff6dc,#f1d9a4);color:#5a3415;border-color:#8a5a2b;text-shadow:none;box-shadow:inset 0 2px 0 #fff,0 4px 0 #8a5a2b}
.btn.small{font-size:16px;border-width:2px}
.btn:disabled{filter:grayscale(.6);opacity:.55}
/* stats = wooden plaques */
.stat{background:linear-gradient(#8a5a2b,#6a3d18);color:#ffe9a8;border:2px solid #e8b04a;box-shadow:0 3px 0 #3e220a;font-size:18px}
.stat small{color:#f5d68a;font-family:Nunito,sans-serif;font-weight:800}
.bar{background:#5a3415;border:2px solid #3e220a;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.bar > i{background:linear-gradient(#c7a8ff,#7a46e8)}
.bar.gold > i{background:linear-gradient(#ffe680,#e0a400)}
.bar.hp > i{background:linear-gradient(#a8f5b4,#2fbf5a)}
.bar.mhp > i{background:linear-gradient(#ffb0a6,#e5432f)}
/* hero stage = stone pedestal on a meadow */
.stage{background:radial-gradient(ellipse 55% 12% at 50% 90%, rgba(0,0,0,.18) 0 60%, transparent 62%),
  linear-gradient(#bfe6ff 0%,#e8f6ff 55%,#bfe39a 56%,#8fcf63 100%);border:3px solid #8a5a2b;border-radius:16px;box-shadow:inset 0 0 0 2px #e8c06a;position:relative;overflow:hidden}
/* inventory slots = dark wood frames */
.slot{background:linear-gradient(#7a4a22,#5a3415);border:3px solid #3e220a;color:#ffe9a8;box-shadow:inset 0 0 0 2px #e8b04a,0 4px 0 #3e220a}
.slot h4{color:#fff3c8;font-size:19px}
.slot .eqd,.slot .muted,.slot .sub{color:#f5d68a}
.slot.maxed{background:linear-gradient(#a07a22,#7a5a15)}
.slot .buy{border-top:1px dashed #b88a4a}
.chip{background:#fff3d6;border:2px solid #b88a4a;color:#5a3415;font-weight:800}
.chip.on{background:linear-gradient(#ffe680,#f5b800);border-color:#7a5200;color:#4a2a00}
.slotpic{display:flex;align-items:center;justify-content:center;height:86px;background:radial-gradient(circle,#9a6a35 0,#5a3415 70%);border:2px solid #e8b04a;border-radius:12px}
.slotpic img{max-height:78px;max-width:92%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.slotpic .empty{color:#c9a56a;font-size:13px}
/* profile cards */
.profile h2{color:#5a3415}
.newhero{background:rgba(255,248,227,.7)}
/* map cards */
.mcard{background:linear-gradient(#fff8e3,var(--parch2));border:3px solid #8a5a2b;box-shadow:inset 0 0 0 2px #e8c06a,0 4px 0 #5e3a17}
.mcard.next{box-shadow:inset 0 0 0 2px #e8c06a,0 0 0 4px #ffd84d,0 4px 0 #5e3a17}
.mcard.beaten{background:linear-gradient(#f2fff0,#d8f0c8)}
/* practice */
.prob{color:#3b2412}
.ans{border:3px solid #b88a4a;background:#fffdf5;color:#3b2412;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
.ans.active{border-color:#7a46e8;box-shadow:0 0 0 4px #e0d2ff}
.pad button,.cmpbtns button,.choice{background:linear-gradient(#fffaf0,#f1dfb6);border:3px solid #8a5a2b;box-shadow:inset 0 2px 0 #fff,0 4px 0 #8a5a2b;color:#3b2412;font-family:"Baloo 2",Nunito,sans-serif}
.pad .go{background:linear-gradient(#8ff0a0,#2fbf5a 50%,#1f9a45);border-color:#0c5a24;color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 #0c5a24}

.tabs button.on{background:linear-gradient(#b48cff,#7a46e8);border-color:#2e1460;color:#fff}
.reward{background:linear-gradient(#fff3c4,#ffd76a);border:4px solid #b8860b;box-shadow:inset 0 0 0 3px #fff2a6,0 6px 0 #7a5200}
.arena{border:4px solid #8a5a2b;box-shadow:inset 0 0 0 2px #e8c06a,0 6px 0 #5e3a17}
.testbanner{background:#fff8dc;border-color:#b8860b;color:#5a3415}
/* images */
.av{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;aspect-ratio:240/250;max-width:240px;margin:0 auto}
.av img.main{max-height:96%;max-width:92%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));position:relative;z-index:1}
.av img.comp{position:absolute;right:2%;bottom:2%;width:28%;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.av.glow::before{content:"";position:absolute;inset:5%;background:radial-gradient(circle,#fff6b0 0,transparent 65%);z-index:0}
.anim .av img.main{animation:breath 3.2s ease-in-out infinite;transform-origin:50% 100%}
.monimg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
img.scene{object-fit:cover}
.mpic .mon > img{height:118px;width:auto;max-width:96%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.mcard.locked .mpic .mon > img{filter:brightness(0) opacity(.55)}
.prestage .mon{display:flex;justify-content:center;align-items:flex-end;height:220px}
.prestage .mon > img{height:210px}
.fighter .av{max-width:200px}
.fighter img.monimg{max-height:210px}
.uiic{height:1.1em;vertical-align:-.18em}

.ctext{font-family:Nunito,sans-serif;font-weight:900;font-size:19px;line-height:1.2;color:#3b2412}
.choices .choice{min-height:84px}
.subjbox{background:rgba(255,255,255,.5);border:2px solid #e8c06a;border-radius:12px;padding:6px 10px;margin:6px 0}

.petav .petwrap{position:absolute;left:50%;transform:translateX(-50%);z-index:2}
.petav .petwrap img.main{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none}
img.ov{position:absolute;height:auto;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.room{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.room img.roombg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room.scene{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
@keyframes flut{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}

.mpic .mon .av{height:118px;width:auto;max-width:none}
.prestage .mon .av{height:210px;width:auto;max-width:none}
.prestage .mon > svg{height:210px;width:auto;max-width:100%}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ============ Utility ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const s = String(Math.abs(n)); const r = s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n<0?'−':'') + r; };
function todayKey(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayDiff(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5); }
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let R = Math.random;
const ri = (a,b) => a + Math.floor(R()*(b-a+1));
const pick = arr => arr[Math.floor(R()*arr.length)];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function confetti(n=40){ const em=['🎉','⭐','✨','🏆','💎','🎈']; for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='conf'; s.textContent=em[Math.floor(Math.random()*em.length)]; s.style.left=Math.random()*100+'vw'; s.style.animationDelay=(Math.random()*0.8)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3200);} }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
/* ============ Problem generators ============ */
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const NAMES = [['Tonda',0],['Ema',1],['Kuba',0],['Bára',1],['Matěj',0],['Anička',1],['Vojta',0],['Klárka',1]];

const CATS = {
  // ---- 1. třída ----
  add10: {grade:1, label:'Sčítání a odčítání do 10', gen(){
    const a=ri(1,9), b=ri(1,10-a); return R()<.5 ? {q:`${a} + ${b}`, a:a+b} : {q:`${a+b} − ${b}`, a:a};
  }},
  add20nb: {grade:1, label:'Do 20 bez přechodu přes desítku', gen(){
    const u=ri(1,8), v=ri(1,9-u);
    return R()<.5 ? {q:`1${u} + ${v}`, a:10+u+v} : {q:`1${u+v} − ${v}`, a:10+u};
  }},
  missing10: {grade:1, label:'Doplň číslo do 10', gen(){
    const a=ri(1,9), c=ri(a+1,10); return R()<.5 ? {q:`${a} + <u>&nbsp;?&nbsp;</u> = ${c}`, a:c-a} : {q:`<u>&nbsp;?&nbsp;</u> + ${c-a} = ${c}`, a:a};
  }},
  compare20: {grade:1, label:'Porovnávání do 20', gen(){
    const lv=ri(0,20), rv=R()<.2?lv:ri(0,20); const useSum=R()<.4 && lv>=2;
    const l = useSum ? (()=>{const x=ri(1,lv-1); return `${x} + ${lv-x}`;})() : lv;
    return {q:`${l} &nbsp;◯&nbsp; ${rv}`, type:'cmp', a: lv<rv?'<':lv>rv?'>':'='};
  }},
  word1: {grade:1, label:'Slovní úlohy (do 20)', word:true, gen(){
    const [n,f]=pick(NAMES), x=f?'a':'', k=ri(0,1);
    if(k===0){ const a=ri(2,9), b=ri(1,9); return {q:`${n} měl${x} ${a} pastelek a dostal${x} ještě ${b}. Kolik pastelek má teď?`, a:a+b}; }
    const a=ri(8,18), b=ri(1,7); return {q:`Na stromě sedělo ${a} ptáčků. ${b} odletělo. Kolik ptáčků zůstalo na stromě?`, a:a-b};
  }},
  // ---- 2. třída ----
  add20:   {grade:2, label:'Sčítání a odčítání do 20 (s přechodem)', gen(){
    const a=ri(3,9), b=ri(11-a,9), c=a+b;
    return R()<.5 ? {q:`${a} + ${b}`, a:c} : {q:`${c} − ${a}`, a:b};
  }},
  addsub100: {grade:2, label:'Sčítání a odčítání do 100', gen(){
    const k=ri(0,4);
    if(k===0){ const a=ri(12,89), b=ri(2,9); if(a+b<=100) return {q:`${a} + ${b}`, a:a+b}; return {q:`${a} − ${b}`, a:a-b}; }
    if(k===1){ const a=ri(21,95), b=ri(2,9); return {q:`${a} − ${b}`, a:a-b}; }
    if(k===2){ const a=ri(11,69), b=ri(1,3)*10; return R()<.5?{q:`${a} + ${b}`, a:a+b}:{q:`${a+b} − ${b}`, a:a}; }
    if(k===3){ const a=ri(11,59), b=ri(11,99-a); return {q:`${a} + ${b}`, a:a+b}; }
    const a=ri(40,99), b=ri(11,a-10); return {q:`${a} − ${b}`, a:a-b};
  }},
  mul2: {grade:2, label:'Malá násobilka 2, 3, 4, 5, 10 a dělení', gen(){
    const m=pick([2,3,4,5,10,2,3,4,5]), n=ri(1,10);
    return R()<.65 ? (R()<.5?{q:`${m} · ${n}`, a:m*n}:{q:`${n} · ${m}`, a:m*n}) : {q:`${m*n} : ${m}`, a:n};
  }},
  missing: {grade:2, label:'Doplň chybějící číslo', gen(){
    const k=ri(0,2);
    if(k===0){ const a=ri(3,9), b=ri(11-a,9); return {q:`<u>&nbsp;?&nbsp;</u> + ${b} = ${a+b}`, a:a}; }
    if(k===1){ const a=ri(20,80), b=ri(3,19); return {q:`${a} + <u>&nbsp;?&nbsp;</u> = ${a+b}`, a:b}; }
    const a=ri(30,90), b=ri(3,25); return {q:`${a} − <u>&nbsp;?&nbsp;</u> = ${a-b}`, a:b};
  }},
  compare: {grade:2, label:'Porovnávání (<, >, =)', gen(){
    const k=ri(0,2); let l,r,lv,rv;
    if(k===0){ lv=ri(10,99); rv=R()<.15?lv:ri(10,99); l=lv; r=rv; }
    else if(k===1){ const a=ri(3,9), b=ri(3,9); lv=a+b; rv=R()<.3?lv:ri(lv-3,lv+3); l=`${a} + ${b}`; r=rv; }
    else { const a=ri(20,60), b=ri(5,30); lv=a+b; const c=ri(20,60); const d=lv-c; if(d>0&&d<40&&R()<.4){rv=lv; r=`${c} + ${d}`;} else {rv=ri(lv-8,lv+8); r=rv;} l=`${a} + ${b}`; }
    return {q:`${l} &nbsp;◯&nbsp; ${r}`, type:'cmp', a: lv<rv?'<':lv>rv?'>':'='};
  }},
  word2: {grade:2, label:'Slovní úlohy (jednoduché)', word:true, gen(){
    const [n,f]=pick(NAMES), k=ri(0,3), x=f?'a':'';
    if(k===0){ const a=ri(12,40), b=ri(5,20); return {q:`${n} měl${x} ${a} kuliček a dostal${x} dalších ${b}. Kolik kuliček má teď?`, a:a+b}; }
    if(k===1){ const a=ri(25,60), b=ri(6,20); return {q:`V autobuse sedělo ${a} lidí. Na zastávce ${b} vystoupilo. Kolik lidí zůstalo v autobuse?`, a:a-b}; }
    if(k===2){ const m=pick([2,3,4,5]), n2=ri(2,8); return {q:`Na stole je ${n2} talířů a na každém leží ${m} jablka. Kolik jablek je dohromady?`.replace(' jablka',m===5?' jablek':' jablka'), a:m*n2}; }
    const m=pick([2,3,4,5]), n2=ri(2,8); return {q:`${m*n2} bonbónů rozdělíme spravedlivě mezi ${m} děti. Kolik bonbónů dostane každé dítě?`, a:n2};
  }},
  // ---- 4. třída ----
  mulall: {grade:4, label:'Celá násobilka a dělení', gen(){
    const m=ri(3,10), n=ri(2,10);
    return R()<.55 ? {q:`${m} · ${n}`, a:m*n} : {q:`${m*n} : ${n}`, a:m};
  }},
  rem: {grade:4, label:'Dělení se zbytkem', gen(){
    const d=ri(3,9), q=ri(2,9), r=ri(1,d-1);
    return {q:`${d*q+r} : ${d}`, type:'rem', a:[q,r]};
  }},
  big: {grade:4, label:'Sčítání a odčítání do 10 000 (zpaměti)', gen(){
    const k=ri(0,3);
    if(k===0){ const a=ri(12,75)*100, b=ri(3,24)*100; return {q:`${fmt(a)} + ${fmt(b)}`, a:a+b}; }
    if(k===1){ const a=ri(30,99)*100, b=ri(3,29)*100; return {q:`${fmt(a)} − ${fmt(b)}`, a:a-b}; }
    if(k===2){ const a=ri(1000,8999), b=ri(1,9)*(R()<.5?10:100); return R()<.5?{q:`${fmt(a)} + ${fmt(b)}`, a:a+b}:{q:`${fmt(a+b)} − ${fmt(b)}`, a:a}; }
    const a=ri(120,890), b=ri(110,600); return {q:`${a} + ${b}`, a:a+b};
  }},
  mulext: {grade:4, label:'Násobení mimo obor násobilky', gen(){
    const k=ri(0,2);
    if(k===0){ const a=ri(2,9)*10, b=ri(2,9); return {q:`${a} · ${b}`, a:a*b}; }
    if(k===1){ const a=ri(2,9)*100, b=ri(2,9); return {q:`${a} · ${b}`, a:a*b}; }
    const a=ri(12,29), b=ri(2,5); return {q:`${a} · ${b}`, a:a*b};
  }},
  divext: {grade:4, label:'Dělení mimo obor násobilky', gen(){
    const k=ri(0,1);
    if(k===0){ const d=ri(2,9), q=ri(2,9)*10; return {q:`${fmt(d*q)} : ${d}`, a:q}; }
    const d=ri(2,4), q=ri(12,24); return {q:`${d*q} : ${d}`, a:q};
  }},
  order: {grade:4, label:'Pořadí početních výkonů, závorky', gen(){
    const k=ri(0,3), a=ri(2,9), b=ri(2,9), c=ri(2,9);
    if(k===0) return {q:`${a+10} + ${b} · ${c}`, a:a+10+b*c};
    if(k===1) return {q:`(${a} + ${b}) · ${c}`, a:(a+b)*c};
    if(k===2) return {q:`${b*c+a} − ${b} · ${c}`, a:a};
    return {q:`${a*c} : ${c} + ${b}`, a:a+b};
  }},
  fractions: {grade:4, label:'Zlomky – část z celku', gen(){
    const den=pick([2,3,4,5,10]), k=ri(2,9);
    const num = (R()<.3 && den>2) ? ri(2,den-1) : 1;
    return {q:`${frac(num,den)} z ${den*k}`, a:num*k};
  }},
  round: {grade:4, label:'Zaokrouhlování', gen(){
    const n=ri(1012,9988), t=pick([10,100,1000]);
    const nm={10:'desítky',100:'stovky',1000:'tisíce'}[t];
    let r = Math.round(n/t)*t;
    return {q:`Zaokrouhli ${fmt(n)} na ${nm}`, a:r, small:true};
  }},
  word4: {grade:4, label:'Slovní úlohy (dvoukrokové)', word:true, gen(){
    const [n,f]=pick(NAMES), k=ri(0,3);
    if(k===0){ const p=ri(3,9), c=ri(12,25), m=p*c+ri(5,60); return {q:`${n} má ${m} Kč. Koupí ${p} sešitů po ${c} Kč. Kolik korun ${f?'jí':'mu'} zbude?`, a:m-p*c}; }
    if(k===1){ const b=ri(8,15), extra=ri(3,15); return {q:`Ve třídě je ${b} lavic a v každé sedí 2 žáci. Na výlet jede ještě ${extra} žáků z jiné třídy. Kolik žáků jede na výlet?`, a:b*2+extra}; }
    if(k===2){ const box=ri(3,8), per=ri(6,9), eaten=ri(2,box*per-5); return {q:`V ${box} krabicích je po ${per} kouscích čokolády. Děti snědly ${eaten} kousků. Kolik kousků zbylo?`, a:box*per-eaten}; }
    const km=ri(12,45), days=ri(3,7); return {q:`Cyklista ujede každý den ${km} km. Kolik kilometrů ujede za ${days} dní?`, a:km*days};
  }},
};

/* Lehčí varianty (výchozí obtížnost) */
let EASY = true;
const EASY_GEN = {
  addsub100(){ const k=ri(0,2);
    if(k===0){ const a=ri(11,89), b=ri(2,9); const u=a%10; if(u+b<10) return {q:`${a} + ${b}`, a:a+b}; const s=Math.min(b,u||b); return {q:`${a} − ${s}`, a:a-s}; }
    if(k===1){ const a=ri(1,8)*10, b=ri(1,9)*10; return a+b<=100 ? {q:`${a} + ${b}`, a:a+b} : {q:`${Math.max(a,b)} − ${Math.min(a,b)}`, a:Math.max(a,b)-Math.min(a,b)}; }
    const a=ri(11,69), b=ri(1,3)*10; return R()<.5?{q:`${a} + ${b}`, a:a+b}:{q:`${a+b} − ${b}`, a:a}; },
  mul2(){ const m=pick([2,3,4,5,10,2,5,10]), n=ri(1,10); return R()<.75 ? {q:`${m} · ${n}`, a:m*n} : {q:`${m*n} : ${m}`, a:n}; },
  missing(){ const a=ri(2,9), b=ri(2,9); return R()<.5 ? {q:`<u>&nbsp;?&nbsp;</u> + ${b} = ${a+b}`, a:a} : {q:`${a+b} − <u>&nbsp;?&nbsp;</u> = ${a}`, a:b}; },
  compare(){ const lv=ri(10,99), rv=R()<.15?lv:ri(10,99); return {q:`${lv} &nbsp;◯&nbsp; ${rv}`, type:'cmp', a: lv<rv?'<':lv>rv?'>':'='}; },
  word2(){ const [n,f]=pick(NAMES), x=f?'a':'', k=ri(0,2);
    if(k===0){ const a=ri(5,20), b=ri(2,9); return {q:`${n} měl${x} ${a} kuliček a dostal${x} ještě ${b}. Kolik kuliček má teď?`, a:a+b}; }
    if(k===1){ const a=ri(12,30), b=ri(2,9); return {q:`V autobuse sedělo ${a} lidí. ${b} vystoupilo. Kolik lidí zůstalo v autobuse?`, a:a-b}; }
    const m=pick([2,5,10]), n2=ri(2,4); return {q:`${n} má ${n2} krabičky a v každé je ${m} ${m===2?'pastelky':'pastelek'}. Kolik pastelek má dohromady?`, a:m*n2}; },
  mulall(){ const m=ri(2,9), n=ri(2,9); return R()<.7 ? {q:`${m} · ${n}`, a:m*n} : {q:`${m*n} : ${n}`, a:m}; },
  rem(){ const d=ri(2,5), q=ri(2,9), r=ri(1,d-1); return {q:`${d*q+r} : ${d}`, type:'rem', a:[q,r]}; },
  big(){ const a=ri(5,60)*100, b=ri(1,20)*100; return R()<.5 ? {q:`${fmt(a)} + ${fmt(b)}`, a:a+b} : {q:`${fmt(a+b)} − ${fmt(b)}`, a:a}; },
  mulext(){ const a=ri(2,9)*10, b=ri(2,5); return {q:`${a} · ${b}`, a:a*b}; },
  divext(){ const d=ri(2,5), q=ri(2,9)*10; return {q:`${d*q} : ${d}`, a:q}; },
  order(){ const a=ri(1,9), b=ri(2,5), c=ri(2,5); return R()<.5 ? {q:`${a} + ${b} · ${c}`, a:a+b*c} : {q:`(${a} + ${b}) · ${c}`, a:(a+b)*c}; },
  fractions(){ const den=pick([2,3,4,5,10]), k=ri(2,6); return {q:`${frac(1,den)} z ${den*k}`, a:k}; },
  round(){ const n=ri(101,999), t=pick([10,100]); return {q:`Zaokrouhli ${n} na ${t===10?'desítky':'stovky'}`, a:Math.round(n/t)*t, small:true}; },
  word4(){ const [n,f]=pick(NAMES), k=ri(0,2);
    if(k===0){ const p=ri(2,4), c=ri(2,9)*5, m=p*c+ri(1,9)*5; return {q:`${n} má ${m} Kč. Koupí ${p} sešity po ${c} Kč. Kolik korun ${f?'jí':'mu'} zbude?`, a:m-p*c}; }
    if(k===1){ const box=ri(3,6), per=ri(4,8); return {q:`V ${box} krabicích je po ${per} kouscích čokolády. Kolik kousků je dohromady?`, a:box*per}; }
    const km=ri(2,9)*10, days=ri(2,4); return {q:`Cyklista ujede každý den ${km} km. Kolik kilometrů ujede za ${days} dny?`, a:km*days}; },
};
function genOne(c){ const g = (EASY && EASY_GEN[c]) ? EASY_GEN[c] : CATS[c].gen; return g.call(CATS[c]); }
const DEFAULT_CATS = {1:['add10','add20nb','missing10','compare20','word1'],
  2:['add20','addsub100','mul2','missing','compare','word2'],
  3:['addsub100','mulall','missing','compare','divext','word2'],
  4:['mulall','rem','big','mulext','divext','order','fractions','round','word4'],
  5:['mulall','rem','big','mulext','divext','order','fractions','round','word4']};
function catsOf(p){ let c=(p.cats&&p.cats.length)?p.cats.filter(x=>CATS[x]):(DEFAULT_CATS[p.grade]||DEFAULT_CATS[2]); return c.length?c:DEFAULT_CATS[2]; }
function battleProblem(p){
  R=Math.random; let cats=catsOf(p).filter(c=>!CATS[c].word); if(!cats.length) cats=['add20'];
  EASY = p.diff!=='normal'; CUR_GRADE = +p.grade||0;
  { const subs=[...new Set(cats.map(subjOf))]; const sj=pick(subs); const f=cats.filter(c=>subjOf(c)===sj); if(f.length) cats=f; }
  const blocked=new Set(p.seen||[]);
  let pr, c;
  for(let i=0;i<60;i++){ c=pick(cats); pr=genOne(c); if(!blocked.has(qKey(pr))) break; }
  pr.cat=c; pr.type=pr.type||'num'; remember(p,[pr]); return pr;
}

function genDaily(profile, dateKey, count=20, onlySubj){
  EASY = profile.diff!=='normal'; CUR_GRADE = +profile.grade||0;
  R = mulberry(hashStr(profile.id + '|' + dateKey + '|' + (profile.cats||[]).join(',') + (EASY?'e':'') + (onlySubj||'')));
  let cats = catsOf(profile);
  if(onlySubj){ const f=cats.filter(c=>subjOf(c)===onlySubj); if(f.length) cats=f; }
  // subjects take turns so every chosen subject gets its share; inside a subject categories take turns too
  const bySubj={}; for(const c of cats){ (bySubj[subjOf(c)]=bySubj[subjOf(c)]||[]).push(c); }
  const subjOrder=['m','en','pr','cj'].filter(x=>bySubj[x]);
  const decks={};
  const out=[], seen=new Set(), blocked=new Set(profile.seen||[]); let guard=0, wordCount=0, turn=0;
  while(out.length<count && guard++<900){
    const sj=subjOrder[turn%subjOrder.length];
    if(!decks[sj]||!decks[sj].length){ decks[sj]=bySubj[sj].slice(); for(let i=decks[sj].length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [decks[sj][i],decks[sj][j]]=[decks[sj][j],decks[sj][i]];} }
    const c=decks[sj].pop(), cat=CATS[c];
    if(cat.word && wordCount>=3) continue;
    const p=genOne(c); p.cat=c; p.type=p.type||'num'; if(cat.word) p.word=true;
    if(seen.has(p.key||p.q)) continue;
    if(blocked.has(qKey(p)) && guard<600) continue;
    seen.add(p.key||p.q);
    if(cat.word) wordCount++;
    out.push(p); turn++;
  }
  R = Math.random;
  remember(profile, out);
  return out;
}

let csVoice=null, enVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); csVoice = vs.find(v=>/^cs/i.test(v.lang)) || null; enVoice = vs.find(v=>/^en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
try{ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }catch(e){}
function speak(text, lang){
  try{ if(!('speechSynthesis' in window) || !text) return; speechSynthesis.cancel();
    const en=/^en/i.test(lang||'');
    const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,'')); u.lang=en?'en-GB':'cs-CZ'; const v=en?enVoice:csVoice; if(v) u.voice=v; u.rate=en?.85:.92; speechSynthesis.speak(u); }catch(e){}
}

function misspell(w){
  const v='aeiouy'; const tries=[
    ()=>w.length>3? w.slice(0,1)+w[2]+w[1]+w.slice(3) : w+'e',
    ()=>{ const i=[...w].findIndex((c,k)=>k>0&&v.includes(c)); if(i<0) return w+'h'; const nv=pick([...v].filter(c=>c!==w[i])); return w.slice(0,i)+nv+w.slice(i+1); },
    ()=>{ const i=ri(1,Math.max(1,w.length-1)); return w.slice(0,i)+w[i-1]+w.slice(i); },
    ()=>w.length>4? w.slice(0,-1) : w+w.slice(-1),
  ];
  return pick(tries)();
}

const LEN_MULT = {short:0.3, mid:0.5, long:0.8};

const MAX_LEVEL = 20;
function mult(){ return LEN_MULT[S.settings.length]||0.5; }
function price(slot,tier,p){ const sl=(p&&slotOf(p,slot))||SLOTMAP[slot]; return Math.max(5, Math.round(sl.items[tier-1][4]*mult()/5)*5); }
function bounty(mi){ return Math.round(MONSTERS[mi].gold*mult()/5)*5; }
function level(p){ return Math.min(MAX_LEVEL, 1+Math.floor((p.xp||0)/(XP_PER_LEVEL[S.settings.length]||20))); }
function xpInfo(p){ const per=XP_PER_LEVEL[S.settings.length]||20, L=level(p); if(L>=MAX_LEVEL) return {L, cur:per, per, max:true}; return {L, cur:(p.xp||0)-(L-1)*per, per}; }
function stats(p){
  const L=level(p); let atk=1+Math.floor((L-1)/2), def=0, hp=20+3*(L-1);
  for(const sl of slotsOf(p)){ const t=(p.eq||{})[sl.id]||0; if(t){ const it=sl.items[t-1]; atk+=it[1]; def+=it[2]; hp+=it[3]; } }
  return {L, atk, def, hp};
}
function analyze(p, mi){
  const st=stats(p), m=foesOf(p)[mi];
  const myDmg=Math.max(1, st.atk-m.def), monDmg=Math.max(1, m.atk-st.def);
  const hits=Math.ceil(m.hp/myDmg), rounds=Math.ceil(st.hp/monDmg);
  return {st, m, myDmg, monDmg, hits, rounds, spare:rounds-hits};
}

function chestSVG(kind, open){
  const gold=kind==='gold', body=gold?'#f2c230':'#9a5b2c', band=gold?'#b88a00':'#5e3517', lock=gold?'#e84393':'#e8c34a';
  const lid = open ? `<path d="M30 70 L170 70 L160 30 Q100 10 40 30Z" fill="${body}" stroke="${band}" stroke-width="4" transform="rotate(-18 30 70)"/>` :
    `<path d="M30 80 Q30 40 100 40 Q170 40 170 80Z" fill="${body}" stroke="${band}" stroke-width="4"/><path d="M60 46 V80 M140 46 V80" stroke="${band}" stroke-width="8"/>`;
  return `<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">${open?`<circle cx="100" cy="80" r="70" fill="#fff3a0" opacity=".7"/><path d="M100 10 l6 30 M60 25 l14 26 M140 25 l-14 26 M30 55 l26 14 M170 55 l-26 14" stroke="#ffd84d" stroke-width="5" stroke-linecap="round"/>`:''}<ellipse cx="100" cy="168" rx="80" ry="8" fill="#000" opacity=".1"/><rect x="30" y="78" width="140" height="84" rx="8" fill="${body}" stroke="${band}" stroke-width="4"/><path d="M60 78 V162 M140 78 V162" stroke="${band}" stroke-width="8"/>${open?'':`<rect x="88" y="70" width="24" height="28" rx="4" fill="${lock}" stroke="${band}" stroke-width="3"/><circle cx="100" cy="84" r="4" fill="${band}"/>`}${lid}</svg>`;
}
function openChestFor(p){
  if(!p.chests || !p.chests.length) return null;
  const kind=p.chests.shift();
  p.owned=p.owned||{};
  const cands = slotsOf(p).filter(sl=>(p.owned[sl.id]||0) < sl.items.length);
  const itemChance = kind==='gold' ? 1 : 0.6;
  if(cands.length && Math.random()<itemChance){
    // cheapest next item out of 3 random slots – drops stay useful for the current stage
    const pool=cands.slice(), sample=[];
    for(let i=0;i<3&&pool.length;i++) sample.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    sample.sort((a,b)=>a.items[p.owned[a.id]||0][4]-b.items[p.owned[b.id]||0][4]);
    const sl=sample[0], t=(p.owned[sl.id]||0)+1; p.owned[sl.id]=t; p.newItem=sl.id+':'+t;
    return {kind, item:sl.items[t-1], slot:sl.name};
  }
  const pts=(kind==='gold'?60:20)+Math.floor(Math.random()*5)*10;
  p.points+=pts; return {kind, points:pts};
}

/* ============ Art: shading, outlines, scenes ============ */
function shade(hex, amt){
  let c=String(hex).replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join('');
  const n=parseInt(c,16); if(isNaN(n)) return hex;
  let r=n>>16, g=n>>8&255, b=n&255; const t=amt<0?0:255, p=Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
let _uid=0;
// Turns flat drawings into shaded, outlined cartoon art:
// every flat fill gets a light→dark gradient, shapes get a dark outline,
// tiny dots, glows and see-through shapes stay without outline.
function stylize(svg, opts={}){
  const U='s'+(++_uid).toString(36);
  const m=svg.match(/^(<svg[^>]*>)([\s\S]*)<\/svg>$/); if(!m) return svg;
  let head=m[1], body=m[2];
  const cols={}; let k=0;
  body = body.replace(/fill="(#[0-9a-fA-F]{3,6})"/g, (all,c)=>{
    const lc=c.toLowerCase(); if(lc==='#000'||lc==='#000000') return all;
    if(!cols[lc]) cols[lc]=U+'g'+(k++);
    return `fill="url(#${cols[lc]})"`;
  });
  // no outline on glows, transparent bits and tiny dots
  body = body.replace(/<(circle|ellipse|path|rect)([^>]*?)(\/?)>/g, (all,tag,attrs,close)=>{
    if(/\sstroke=/.test(attrs)) return all;
    let none = /opacity=/.test(attrs) || /fill="url\(#[gr]h/.test(attrs) || /fill="#000/.test(attrs);
    const rm = attrs.match(/\sr="([\d.]+)"/); if(tag==='circle' && rm && +rm[1] < 2.6) none=true;
    if(/fill="url\(#(g|r)[a-z0-9]{5}\)"/.test(attrs)) none=true;
    return none ? `<${tag}${attrs} stroke="none"${close}>` : all;
  });
  const grads = Object.entries(cols).map(([c,id])=>`<linearGradient id="${id}" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="${shade(c,.28)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.22)}"/></linearGradient>`).join('');
  const sw = opts.sw || 2.2;
  return `${head}<defs>${grads}</defs><g stroke="#2b2340" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
}
function heroSVG(p, opts={}){ return stylize(heroBase(p, opts), {sw:2.2}); }
function monsterSVG(i){
  let s=monsterBase(i);
  s=s.replace(/^(<svg[^>]*>)(<ellipse[^>]*\/>)/, '$1$2<g class="mb">').replace(/<\/svg>$/,'</g></svg>');
  return stylize(s,{sw:2.6});
}

  if(fn==='loadAll'){ const r=await fetch(BACKEND+'?t='+Date.now()); if(!r.ok) throw new Error(r.status); return r.json(); }
  const body = fn==='saveItems' ? {action:'save', items:arg} : {action:'log', result:arg};
  const r=await fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});

let writing=false, pendingWrite=false, saveTimer=null, syncState=HAS_GAS?'loading':'local';

  S.savedAt=Date.now();

  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
}
async function flush(){
  if(!HAS_GAS) return;
  if(writing){ pendingWrite=true; return; }
  writing=true;
  try{
    const items={};
    const sj=JSON.stringify(S.settings); if(lastSent.settings!==sj) items.settings=sj;
    for(const p of S.profiles){ const j=JSON.stringify(p); if(lastSent[p.id]!==j) items[p.id]=j; }
    if(Object.keys(items).length){ await gas('saveItems', items); Object.assign(lastSent, items); }
    syncState='cloud';
  }catch(e){ syncState='offline'; setTimeout(flush, 8000); }
  writing=false;
  if(pendingWrite){ pendingWrite=false; flush(); }
  updateSyncNote();
}
async function pull(rerender){
  if(!HAS_GAS || writing) return;
  try{
    const r = await gas('loadAll');
    if(r && r.settings){ S.settings=JSON.parse(r.settings); lastSent.settings=r.settings; const before=S.settings.ver; migrateSettings(); if(before!==S.settings.ver) setTimeout(flush,100); }
    for(const [id,j] of Object.entries((r&&r.profiles)||{})){
      const o=migrate(JSON.parse(j)); const i=S.profiles.findIndex(p=>p.id===id);
      if(i>=0) S.profiles[i]=o; else S.profiles.push(o);
      lastSent[id]=j;
    }
    saveLocal(); syncState='cloud';
    if(!r || !r.settings) flush();
    if(rerender) render();
  }catch(e){ syncState='offline'; }
  updateSyncNote();
}

function probHTML(pr){
  const plain=String(pr.q).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');
  const hasEq=/=/.test(plain), long=!pr.word && plain.length>16;
  const sayB = ((pr.type==='choice'&&pr.say)||pr.word) ? ` <button class="say" data-say title="Přečíst nahlas">🔊</button>` : '';
  if(pr.type==='choice') return `<div class="prob mid">${pr.q}${sayB}</div>${pr.pic?`<div class="pic0">${pr.pic}</div>`:''}`;
  return `<div class="prob ${pr.word?'word':''} ${long?'mid':''}">${pr.q}${pr.word||pr.small||pr.type==='cmp'||hasEq?'':' = '}${sayB}</div>`;
}
function inputHTML(pr){
  let input='';
  if(pr.type==='num') input=`<div class="ansrow">${pr.word||pr.small?'<span style="font-size:22px">Výsledek:</span>':''}<input class="ans active" id="a1" inputmode="numeric" autocomplete="off" maxlength="6"></div>`;
  if(pr.type==='rem') input=`<div class="ansrow"><input class="ans sm active" id="a1" inputmode="numeric" autocomplete="off" maxlength="4"><span style="font-size:26px">zbytek</span><input class="ans sm" id="a2" inputmode="numeric" autocomplete="off" maxlength="3"></div>`;
  if(pr.type==='choice') return `<div class="choices n${pr.options.length}">${pr.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`;
  const pad = pr.type==='cmp' ? `<div class="cmpbtns"><button data-cmp="<">&lt;</button><button data-cmp="=">=</button><button data-cmp=">">&gt;</button></div>` :
    `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="go">✓</button></div>`;
  return input+pad;
}

/* ---- map / pre-fight ---- */
function analysisHTML(p, mi){
  const a=analyze(p,mi), m=a.m, st=a.st, M=modeOf(p), RW=M.roundsW;
  let cls, txt;
  if(a.spare>=2){ cls='good'; txt=`💪 Máš dobrou šanci! Potřebuješ <b>${a.hits}</b> správných odpovědí a vydržíš <b>${a.rounds}</b> ${plural(a.rounds,RW[0],RW[1],RW[2])}. Můžeš udělat až ${a.spare} ${plural(a.spare,'chybu','chyby','chyb')}.`; }
  else if(a.spare>=0){ cls='tight'; txt = a.spare===0 ? `😬 Bude to hodně těsné – nesmíš udělat ani jednu chybu! (${a.hits} zásahů, vydržíš ${a.rounds} ${plural(a.rounds,RW[0],RW[1],RW[2])})` : `😬 Těsné! Můžeš udělat jen 1 chybu. (${a.hits} zásahů, vydržíš ${a.rounds} ${plural(a.rounds,RW[0],RW[1],RW[2])})`; }
  else {
    cls='bad';
    const atkNeed=Math.ceil(m.hp/a.rounds)+m.def;
    txt=`⛔ Na tohle jsi zatím ${G(p,M.weakW[0],M.weakW[1])}. Potřebuješ ${a.hits} správných odpovědí, ale vydržíš jen ${a.rounds} ${plural(a.rounds,RW[0],RW[1],RW[2])} – nepovede se to ani bez chyby.`;
    if(st.atk<=m.def) txt+=`<br>${M.st[0][1]} ${M.st[0][0]} musí být vyšší než ${m.def}!`;
    else txt+=`<br>Pomůže vyšší ${M.st[0][1].toLowerCase()} ${M.st[0][0]} (aspoň ${atkNeed}, teď máš ${st.atk}), nebo víc ${M.st[1][0]} a ${M.st[2][0]}.`;
  }
  return `<div class="analysis ${cls}">${txt}</div><div class="sub" style="margin-top:8px">💡 Tip: ${tipFor(p,mi)}.</div>`;
}
function mapView(){

      <div><b>Ty:</b> ${M.st[0][0]} ${a.st.atk} · ${M.st[1][0]} ${a.st.def} · ${M.st[2][0]} ${a.st.hp}
        <div class="sub" style="margin-top:6px">${M.explain(a.myDmg,a.monDmg)}</div>
        ${analysisHTML(p,sel)}
        ${beaten?'<p class="sub">Tohle už máš splněné – můžeš si to zopakovat, ale odměnu už nedostaneš.</p>':`<p class="sub">Odměna za vítězství: ⭐ ${bounty(sel)}${sel===9?' + velká odměna od rodičů!':''}</p>`}
        <div class="row"><button class="btn red" data-fight="${sel}" style="font-size:20px">${M.fightBtn}</button><button class="btn sec" data-act="hero">🛍️ Obchod</button></div>
      </div></div></div>`;
  }
  const M=modeOf(p);
  const cards = foesOf(p).map((m,i)=>{
    const locked=i>p.beaten, beaten=i<p.beaten, next=i===p.beaten;

/* ============ Interaction ============ */
function confirmBox(text, cb){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><p style="font-size:18px">${text}</p><div class="row" style="justify-content:center"><button class="btn" id="mok">Ano</button><button class="btn sec" id="mno">Zrušit</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mok').onclick=()=>{m.remove(); cb();};
  m.querySelector('#mno').onclick=()=>m.remove();
}
function pinBox(text, cb){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><p style="font-size:18px">${text}</p><input type="password" class="ans sm" id="mpin" inputmode="numeric" maxlength="4" autocomplete="off" style="margin:6px auto"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="mok">OK</button><button class="btn sec" id="mno">Zrušit</button></div></div>`;
  document.body.appendChild(m);
  const inp=m.querySelector('#mpin'); inp.focus();
  const ok=()=>{ const v=inp.value; m.remove(); cb(v); };
  m.querySelector('#mok').onclick=ok; inp.onkeydown=e=>{ if(e.key==='Enter') ok(); };
  m.querySelector('#mno').onclick=()=>m.remove();
}
function showChest(){
  const p=prof(view.pid); if(!p || !p.chests || !p.chests.length) return;
  const kind=p.chests[0];
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><div id="chbox" style="max-width:220px;margin:0 auto" class="shake">${chestSVG(kind)}</div><p id="chtxt" style="font-size:20px">Otevírám…</p><div id="chbtn"></div></div>`;
  document.body.appendChild(m);
  const box=m.querySelector('#chbox'); let n=0;
  const iv=setInterval(()=>{ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); if(++n>=2) clearInterval(iv); },380);
  setTimeout(()=>{
    const r=openChestFor(p); save();
    box.innerHTML=chestSVG(kind,true);
    m.querySelector('#chtxt').innerHTML = r.item
      ? `<div style="font-size:26px">✨ ${r.item[0]} ✨</div><div class="muted">${r.slot} · ${itemStatText(r.item)}</div><p style="font-size:16px">Najdeš ho v batohu – klikni na něj a nasaď si ho!</p>`
      : `<div style="font-size:30px">⭐ +${r.points} bodů</div>`;
    m.querySelector('#chbtn').innerHTML=`<button class="btn ok">Super!</button>`;
    m.querySelector('#chbtn button').onclick=()=>{ m.remove(); render(); };
    confetti(r.kind==='gold'?50:25);
  }, 1200);
}
function startExtra(subj){
  const p=prof(view.pid); if(!p) return; ensureToday(p);
  if(!p.extraSet || p.extraSet.date!==todayKey() || p.extraSet.subj!==subj || p.extraSet.idx===0){
    p.extraSet={date:todayKey(),subj,idx:0,tries:0,res:[],problems:genDaily(p,todayKey()+'-extra-'+Date.now(),S.settings.perDay||10,subj),pts:0,wrong:[]}; save(); }
  go({name:'play',pid:p.id,practice:p.extraSet,lvlStart:level(p)});
}
function openHero(id){
  const p=prof(id); if(!p) return;
  if(p.pin && !unlocked.has(p.id)){
    pinBox(`🔒 Zadej tajný kód pro ${esc(p.name)}`, v=>{ if(v===String(p.pin)){ unlock(p.id); go({name:'hero',pid:p.id}); } else toast('Špatný kód. Zeptej se rodičů, pokud ho nevíš.'); });
  } else go({name:'hero',pid:p.id});
}
function readDraft(){ if(!draft) return; const pn=$('#c-petname'); if(pn) draft.petName=pn.value; const n=$('#c-name'), g=$('#c-grade'), pin=$('#c-pin'), r=$('#c-reward'); if(n) draft.name=n.value; if(g) draft.grade=+g.value; if(pin) draft.pin=pin.value.replace(/\D/g,''); if(r) draft.reward=r.value; }

function bind(){
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openHero(el.dataset.open));
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); act(el.dataset.act); });
  document.querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>buy(el.dataset.buy));
  document.querySelectorAll('[data-eq]').forEach(el=>el.onclick=()=>equip(...el.dataset.eq.split(':')));
  document.querySelectorAll('[data-sel]').forEach(el=>el.onclick=()=>{ view.sel=+el.dataset.sel; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('[data-chest]').forEach(el=>el.onclick=()=>showChest());
  document.querySelectorAll('[data-fight]').forEach(el=>el.onclick=()=>startBattle(+el.dataset.fight));
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{parentTab=el.dataset.tab; render();});
  document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{ const p=prof(parentHero); p.color=el.dataset.color; save(); render(); });
  document.querySelectorAll('[data-gender]').forEach(el=>el.onclick=()=>{ readDraft(); draft.gender=el.dataset.gender; render(); });
  document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{ readDraft(); draft.mode=el.dataset.mode; render(); });
  document.querySelectorAll('[data-species]').forEach(el=>el.onclick=()=>{ readDraft(); draft.species=el.dataset.species; render(); });
  document.querySelectorAll('[data-subjon]').forEach(el=>el.onchange=()=>{ const box=el.closest('.subjbox'); if(!box) return; const cs=[...box.querySelectorAll('[data-cat]')]; if(!el.checked) cs.forEach(x=>x.checked=false); else if(!cs.some(x=>x.checked)){ const d=defaultCats(+($('#p-grade')||{}).value||0,[el.dataset.subjon]); cs.forEach(x=>x.checked=d.includes(x.dataset.cat)); } });
  document.querySelectorAll('.subjbox [data-cat]').forEach(el=>el.onchange=()=>{ const sb=el.closest('.subjbox').querySelector('[data-subjon]'); const any=[...el.closest('.subjbox').querySelectorAll('[data-cat]')].some(x=>x.checked); sb.checked=any; });
  document.querySelectorAll('[data-playsubj]').forEach(el=>el.onclick=()=>startExtra(el.dataset.playsubj));
  document.querySelectorAll('[data-subj]').forEach(el=>el.onclick=()=>{ readDraft(); const s=el.dataset.subj; draft.subjects=draft.subjects||['m']; if(draft.subjects.includes(s)){ if(draft.subjects.length>1) draft.subjects=draft.subjects.filter(x=>x!==s); } else draft.subjects.push(s); render(); });
  document.querySelectorAll('[data-feed]').forEach(el=>el.onclick=()=>feed(el.dataset.feed));
  document.querySelectorAll('[data-ccolor]').forEach(el=>el.onclick=()=>{ readDraft(); draft.color=el.dataset.ccolor; render(); });
  const psel=$('#p-sel'); if(psel) psel.onchange=()=>{ parentHero=psel.value; render(); };
  if(view.name==='play' || view.name==='battle'){
    document.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>key(el.dataset.k));
    document.querySelectorAll('[data-cmp]').forEach(el=>el.onclick=()=>submit(el.dataset.cmp));
    document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{ if(el.disabled||busy) return; lastChoice=el; submit(+el.dataset.choice); });
    document.querySelectorAll('[data-say]').forEach(el=>el.onclick=()=>{ const pr=curProblem(); if(pr) speak(sayText(pr), pr.lang); });
    { const pr=curProblem(), pp=prof(view.pid); if(pr && pr.type==='choice' && pr.say && !pr.noAuto && (pr.lang || (pp&&+pp.grade<=1)) && pr!==lastSpoken){ lastSpoken=pr; setTimeout(()=>speak(sayText(pr), pr.lang),250); } }
    document.querySelectorAll('.ans').forEach(el=>{
      el.onfocus=()=>{ document.querySelectorAll('.ans').forEach(x=>x.classList.remove('active')); el.classList.add('active'); };
      el.oninput=()=>{ el.value=el.value.replace(/[^\d]/g,''); };
      el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); key('ok'); } };
    });
    const a1=$('#a1'); if(a1 && matchMedia('(pointer:fine)').matches) a1.focus();
  }
  if(view.name==='parent' && !parentOk){ const pin=$('#pin'); if(pin){ pin.focus(); pin.onkeydown=e=>{ if(e.key==='Enter') act('pinok'); }; } }
}

let busy=false;
function curProblem(){ if(view.name==='battle') return view.b.pr; const t=view.practice || prof(view.pid).today; return t && t.problems[t.idx]; }
function key(k){
  const pr=curProblem(); if(!pr || busy) return;
  if(k==='ok'){
    if(pr.type==='rem'){ const a=$('#a1').value, b=$('#a2').value; if(a===''||b===''){ (a===''?$('#a1'):$('#a2')).focus(); return;} submit([+a,+b]); }
    else { const v=$('#a1').value; if(v==='') return; submit(+v); }
    return;
  }
  const inp=document.querySelector('.ans.active') || $('#a1'); if(!inp) return;
  if(k==='del') inp.value=inp.value.slice(0,-1);
  else if(inp.value.length < (+inp.maxLength||6)) inp.value+=k;
}
let lastChoice=null, lastSpoken=null;
function isCorrect(pr,val){ if(pr.type==='choice') return val===pr.a; return pr.type==='rem' ? (val[0]===pr.a[0] && val[1]===pr.a[1]) : val===pr.a; }
function shownAnswer(pr){ if(pr.type==='choice') return `<span class="inlinechoice">${pr.options[pr.a]}</span>`; return pr.type==='rem' ? `${pr.a[0]} zbytek ${pr.a[1]}` : pr.type==='cmp' ? pr.a : fmt(pr.a); }
function submit(val){ if(view.name==='battle') battleAnswer(val); else answer(val); }
function setFb(cls, html){ const fb=$('#fb'); if(fb){ fb.className='fb '+cls; fb.innerHTML=html; } }

/* ---- daily practice ---- */
function answer(val){
  if(busy) return;
  const p=prof(view.pid), t=view.practice || p.today, pr=t.problems[t.idx];
  const card=$('#pcard');
  if(isCorrect(pr,val)){
    const r = t.tries ? 1 : 2; t.res[t.idx]=r;
    const gain = r===2?10:4;
    p.xp=(p.xp||0)+1;
    p.points+=gain; t.pts+=gain; p.totalCorrect++;
    setFb('ok', pick(['Správně! 🎉','Výborně! ⭐','Paráda! 💪','Super! 🚀','Přesně tak! ✨']) + (gain?`  +${gain}`:''));
    card.classList.add('pop'); next(t, 650);
  } else if(!t.tries){
    t.tries=1; setFb('bad','Ještě jednou – zkus to znovu 🙂');
    if(pr.type==='choice' && lastChoice){ lastChoice.disabled=true; lastChoice.classList.add('wrong'); speak('Zkus to ještě jednou.'); }
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.querySelectorAll('.ans').forEach(i=>i.value=''); const a1=$('#a1'); if(a1){ document.querySelectorAll('.ans').forEach(x=>x.classList.remove('active')); a1.classList.add('active'); if(matchMedia('(pointer:fine)').matches) a1.focus(); }
    save();
  } else {
    t.res[t.idx]=0; setFb('bad', `Správně je <b>${shownAnswer(pr)}</b>. Příště to dáš!`);
    (t.wrong = t.wrong||[]).push({q:pr.q, a:shownAnswer(pr), cat:pr.cat});
    next(t, 2200);
  }
}
function next(t, delay){
  busy=true; save();
  setTimeout(()=>{ busy=false; t.idx++; t.tries=0;
    if(t.idx>=t.problems.length) finish(t); else { save(); render(); } }, delay);
}
function finish(t){
  const p=prof(view.pid);
  const correct=t.res.filter(r=>r>0).length, total=t.problems.length;
  const wrong=(t.wrong||[]).map(w=>`${w.q.replace(/<u>.*?<\/u>/,'?').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')} → ${w.a}`);
  const lvlBefore = view.lvlStart||0;
  if(view.practice){
    const base=t.pts, perfect=t.res.every(r=>r===2);
    p.points+=15; t.pts+=15;
    if(perfect){ p.chests=p.chests||[]; p.chests.push('wood'); }
    const k=todayKey(); p.history=p.history||{};
    const h=p.history[k]||{c:0,n:0,pts:0,wrongCats:[]};
    h.c+=correct; h.n+=total; h.pts+=t.pts; h.extra=(h.extra||0)+1; h.wrongCats=[...new Set([...(h.wrongCats||[]),...(t.wrong||[]).map(w=>w.cat)])];
    p.history[k]=h; p.extraSet=null; save();
    logResult(p, {c:correct, n:total, pts:t.pts, wrongCats:[...new Set((t.wrong||[]).map(w=>w.cat))]});
    confetti(perfect?40:20);
    view={name:'summary',pid:p.id,sum:{practice:true,correct,total,wrong,base,pts:t.pts,perfect,lvlUp:level(p)>lvlBefore}}; render(); return; }
  const base=t.pts; let bonus=30; const perfect=t.res.every(r=>r===2);
  if(perfect) bonus+=30;
  const k=todayKey();
  if(p.lastDone && dayDiff(p.lastDone,k)===1) p.streak++; else if(p.lastDone!==k) p.streak=1;
  p.lastDone=k;
  const streakBonus=p.streak>=3; if(streakBonus) bonus+=10;
  p.points+=bonus; t.pts+=bonus; t.done=true;
  p.chests=p.chests||[]; p.chests.push(perfect?'gold':'wood');
  p.history=p.history||{};
  p.history[k]={c:correct,n:total,pts:t.pts,wrongCats:[...new Set((t.wrong||[]).map(w=>w.cat))]};
  const hk=Object.keys(p.history).sort(); while(hk.length>90) delete p.history[hk.shift()];
  save(); logResult(p, p.history[k]); confetti(perfect?60:30);
  view={name:'summary',pid:p.id,sum:{correct,total,base,pts:t.pts,perfect,streakBonus,wrong,lvlUp:level(p)>lvlBefore}};
  render();
}

/* ---- gear ---- */
function buy(slot){
  const p=prof(view.pid); p.owned=p.owned||{}; const own=p.owned[slot]||0, sl=slotOf(p,slot);
  if(own>=sl.items.length) return;
  const c=price(slot,own+1,p); if(p.points<c) return;
  p.points-=c; p.owned[slot]=own+1; p.newItem=slot+':'+(own+1); save();
  toast(`🛍️ ${sl.items[own][0]} – koupeno! Klikni na to v seznamu a ${modeOf(p).equipWord}.`);
  render();
}
function equip(slot, tier){
  const p=prof(view.pid); tier=+tier; p.eq=p.eq||{};
  const sl=slotOf(p,slot), M=modeOf(p);
  if(p.eq[slot]===tier){ p.eq[slot]=0; toast(`${M.removed}: ${sl.items[tier-1][0]}`); }
  else { p.eq[slot]=tier; toast(`${M.equipped}: ${sl.items[tier-1][0]} ✨`); }
  if(p.newItem===slot+':'+tier) p.newItem=null;
  save(); render();
}

/* ---- battle ---- */
function startBattle(mi){
  const p=prof(view.pid); if(mi>p.beaten) return;
  const st=stats(p);
  go({name:'battle', pid:p.id, b:{mi, hp:st.hp, maxHp:st.hp, mhp:foesOf(p)[mi].hp, round:1, hits:0, miss:0, pr:battleProblem(p)}});
}
function anim(id, cls){ const el=document.getElementById(id); if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function floatTxt(id, txt, cls=''){ const el=document.getElementById(id); if(!el) return; const d=document.createElement('div'); d.className='dmg '+cls; d.textContent=txt; el.appendChild(d); setTimeout(()=>d.remove(),1000); }
function updBars(){ const b=view.b, p=prof(view.pid), m=foesOf(p)[b.mi], M=modeOf(p);
  const h=$('#hhp'), mh=$('#mhp'); if(h) h.style.width=(b.hp/b.maxHp*100)+'%'; if(mh) mh.style.width=(b.mhp/m.hp*100)+'%';
  const ht=$('#hhpt'), mt=$('#mhpt'); if(ht) ht.textContent=`${M.st[2][0]} ${b.hp}/${b.maxHp}`; if(mt) mt.textContent=`${M.fst[2][0]} ${b.mhp}/${m.hp}`; }
function battleAnswer(val){
  if(busy) return; busy=true;
  const b=view.b, p=prof(view.pid), st=stats(p), m=foesOf(p)[b.mi], pr=b.pr, M=modeOf(p);
  const ok=isCorrect(pr,val);
  document.querySelectorAll('.pad button,.cmpbtns button').forEach(x=>x.disabled=true);
  if(ok){
    p.xp=(p.xp||0)+1;
    const d=Math.max(1, st.atk-m.def); b.mhp=Math.max(0,b.mhp-d); b.hits++;
    setFb('ok', pick(M.hit));
    anim('fh','lunge'); setTimeout(()=>{ anim('fm','hitme'); floatTxt('fm',(p.mode==='quest'?'−':'+')+d); updBars(); },200);
    if(b.mhp<=0){ setTimeout(()=>battleEnd(true),1200); return; }
  } else {
    b.miss++; setFb('bad', `${M.miss} Správně bylo <b>${shownAnswer(pr)}</b>.`); floatTxt('fm',M.missFloat,'miss');
  }
  setTimeout(()=>{
    const md=Math.max(1, m.atk-st.def); b.hp=Math.max(0,b.hp-md);
    anim('fm','lungeL'); setTimeout(()=>{ anim('fh','hitme'); floatTxt('fh','−'+md); updBars(); },200);
    if(b.hp<=0){ setTimeout(()=>battleEnd(false),1200); return; }
    setTimeout(()=>{ b.round++; b.pr=battleProblem(p); busy=false; render(); }, 900);
  }, ok?900:1700);
}
function battleEnd(win){
  busy=false;
  const p=prof(view.pid), b=view.b;
  const first = win && b.mi===p.beaten;
  let gold=0;
  if(first){ p.beaten++; gold=bounty(b.mi); p.points+=gold; if(b.mi===9) p.rewardClaimed=false; p.chests=p.chests||[]; p.chests.push(b.mi===9?'gold':'wood'); }
  save();
  if(win) confetti(b.mi===9?100:35);
  view={name:'bend', pid:p.id, e:{win, mi:b.mi, first, gold, hits:b.hits, miss:b.miss, mhp:b.mhp}};
  render(); window.scrollTo(0,0);
}

/* ---- actions ---- */
function act(a){
  const p = view.pid ? prof(view.pid) : null;
  switch(a){
  case 'home': draft=null; go({name:'home'}); break;
  case 'parent': parentOk=false; go({name:'parent'}); break;
  case 'lock': parentOk=false; go({name:'home'}); break;
  case 'create': draft=null; go({name:'create'}); break;
  case 'createok': {
    readDraft(); const name=(draft.name||'').trim();
    if(!name){ toast('Napiš své jméno 🙂'); $('#c-name').focus(); return; }
    if(draft.pin && !/^\d{4}$/.test(draft.pin)){ toast('Tajný kód musí mít 4 číslice (nebo nech prázdné).'); return; }
    if(draft.mode==='pet' && !(draft.petName||'').trim()){ toast('Vymysli jméno pro zvířátko 🐾'); return; }
    const np=newProfile({name, grade:draft.grade, gender:draft.gender, color:draft.color, pin:draft.pin, reward:(draft.reward||'').trim(), mode:draft.mode, species:draft.species, petName:(draft.petName||'').trim(), cats:defaultCats(draft.grade, draft.subjects||['m'])});
    S.profiles.push(np); unlock(np.id); save(); draft=null;
    toast(`Vítej, ${np.name}! ${modeOf(np).icon}`); go({name:'hero',pid:np.id}); break; }
  case 'hero': case 'back': go({name:'hero',pid:view.pid}); break;
  case 'map': go({name:'map',pid:view.pid, sel: p && p.beaten<10 ? p.beaten : null}); break;
  case 'flee': confirmBox(modeOf(p).flee, ()=>go({name:'map',pid:view.pid,sel:view.b.mi})); break;
  case 'play': {
    const t=ensureToday(p);
    if(t.done){ if(!p.extraSet || p.extraSet.date!==todayKey()){ p.extraSet={date:todayKey(),idx:0,tries:0,res:[],problems:genDaily(p,todayKey()+'-extra-'+Date.now(),S.settings.perDay||10),pts:0,wrong:[]}; save(); } go({name:'play',pid:p.id,practice:p.extraSet,lvlStart:level(p)}); }
    else go({name:'play',pid:p.id,lvlStart:level(p)});
    break; }
  // test tools
  case 't-pts': p.points+=500; save(); render(); break;
  case 't-lvl': p.xp=(p.xp||0)+(XP_PER_LEVEL[S.settings.length]||40); save(); render(); toast(`Úroveň ${level(p)}`); break;
  case 't-unlock': p.beaten=Math.max(p.beaten,9); save(); render(); toast('Odemčeno až po poslední výzvu'); break;
  case 't-all': slotsOf(p).forEach(sl=>{ p.owned[sl.id]=sl.items.length; p.eq[sl.id]=sl.items.length; }); p.xp=Math.max(p.xp||0,(MAX_LEVEL-1)*(XP_PER_LEVEL[S.settings.length]||40)); save(); render(); break;
  case 't-chest': p.chests=p.chests||[]; p.chests.push(Math.random()<.3?'gold':'wood'); save(); render(); break;
  case 't-reset': confirmBox('Začít s testovacím hrdinou znovu?', ()=>{ const o=TEST; TEST=newProfile({id:'test',name:o.name,grade:o.grade,gender:o.gender,color:'#1fb5c9',mode:o.mode,species:o.species,petName:o.petName}); saveLocal(); render(); }); break;
  case 't-new': { const g=+$('#t-grade').value, s=$('#t-gender').value, md=$('#t-mode').value, spc=$('#t-species').value; TEST=newProfile({id:'test',name:'Testovací '+(s==='f'?'hrdinka':'hrdina'),grade:g,gender:s,color:'#1fb5c9',mode:md,species:spc,petName:'Testík'}); saveLocal(); go({name:'hero',pid:'test'}); break; }
  case 't-open': go({name:'hero',pid:'test'}); break;
  // parent
  case 'pinok': { const v=$('#pin').value; if(v===String(S.settings.pin)){ parentOk=true; render(); } else { toast('Špatný PIN'); $('#pin').value=''; } break; }
  case 'savesettings':
    S.settings.reward=$('#s-reward').value.trim()||S.settings.reward;
    S.settings.length=$('#s-len').value;
    S.settings.perDay=Math.max(5,Math.min(40,parseInt($('#s-per').value)||20));
    { const np=$('#s-pin').value.trim(); if(np) S.settings.pin=np; }
    save(); toast('Uloženo ✓'); render(); break;
  case 'saveprofile': case 'defcats': case 'regen': {
    const h=prof(parentHero);
    h.name=$('#p-name').value.trim()||h.name;
    h.gender=$('#p-gender').value; h.diff=$('#p-diff').value;
    if($('#p-species')) h.species=$('#p-species').value; if($('#p-petname')) h.petName=$('#p-petname').value.trim();
    const nm=$('#p-mode').value;
    if(nm!==(h.mode||'quest')){ confirmBox(`Změnit dobrodružství na „${MODES[nm].title}“? Body, věci a postup se vynulují.`, ()=>{ Object.assign(h,{mode:nm,points:0,xp:0,owned:{},eq:{},beaten:0,rewardClaimed:false,newItem:null,species:h.species||'cat',petName:h.petName||'Mazlíček'}); save(); render(); toast('Dobrodružství změněno'); }); return; }
    const pin=$('#p-pin').value.trim(); if(pin && !/^\d{4}$/.test(pin)){ toast('Kód musí mít 4 číslice'); return; } h.pin=pin;
    h.reward=$('#p-reward').value.trim();
    const g=+$('#p-grade').value;
    const subsOn=[...new Set([...document.querySelectorAll('[data-subjon]')].filter(x=>x.checked).map(x=>x.dataset.subjon).concat([...document.querySelectorAll('[data-cat]')].filter(x=>x.checked).map(x=>subjOf(x.dataset.cat))))]; if(!subsOn.length) subsOn.push('m');
    if(a==='defcats' || g!==+h.grade){ h.grade=g; h.cats=defaultCats(g, subsOn); }
    else {
      let c=[...document.querySelectorAll('[data-cat]')].filter(x=>x.checked).map(x=>x.dataset.cat);
      c=c.filter(k=>subsOn.includes(subjOf(k)));
      for(const s of subsOn){ if(!c.some(k=>subjOf(k)===s)) c=c.concat(defaultCats(h.grade,[s])); }
      h.cats=c.length?c:defaultCats(h.grade,['m']);
    }
    if(a==='regen'){
      if(h.today && h.today.date===todayKey() && (h.today.done || h.today.idx>0)) toast('Dnešek už je rozpracovaný – změna platí od zítřka.');
      else { h.today=null; ensureToday(h); toast('Dnešní příklady vygenerovány znovu ✓'); }
    } else toast('Uloženo ✓');
    save(); render(); break; }
  case 'bonus': { const h=prof(parentHero); const v=parseInt($('#p-bonus').value)||0; h.points=Math.max(0,h.points+v); save(); toast(`${v>=0?'Připsáno':'Odečteno'} ${Math.abs(v)} bodů`); render(); break; }
  case 'claimed': { const h=prof(parentHero); h.rewardClaimed=true; save(); render(); break; }
  case 'newseason': { const h=prof(parentHero); confirmBox(`Začít novou výpravu pro ${esc(h.name)}? Body, výbava, úroveň i obludy se vynulují.`, ()=>{ Object.assign(h,{points:0,xp:0,owned:{},eq:{},beaten:0,rewardClaimed:false,newItem:null}); h.season=(h.season||1)+1; save(); render(); toast('Nová výprava začíná! 🚀'); }); break; }
  case 'delhero': { const h=prof(parentHero); confirmBox(`Opravdu smazat hrdinu ${esc(h.name)}? Tohle nejde vrátit.`, ()=>{ h.deleted=true; h.history={}; h.today=null; parentHero=null; save(); render(); toast('Smazáno'); }); break; }
  case 'copybk': { const v=$('#bk').value; try{ navigator.clipboard.writeText(v).then(()=>toast('Zkopírováno ✓'),()=>{ $('#bk').select(); toast('Označeno – zkopírujte Ctrl+C'); }); }catch(e){ $('#bk').select(); toast('Označeno – zkopírujte Ctrl+C'); } break; }
  case 'importbk': try{ const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim())))); if(!o.profiles) throw 0; confirmBox('Načíst zálohu? Současný postup se přepíše.', ()=>{ S=o; S.profiles.forEach(migrate); save(); toast('Záloha načtena ✓'); render(); }); }catch(e){ toast('Kód se nepodařilo načíst'); } break;
  }
}

render();
pull(true);
</script>
</body>
