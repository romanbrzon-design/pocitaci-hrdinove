<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Počítací hrdinové</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2b2340; --muted:#7a7090;
  --pri:#6c4cf5; --pri2:#8f78ff; --ok:#1fae6b; --bad:#ec5050; --gold:#f5b400;
  --line:#efe6d6; --soft:#f4efff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:24px;margin:0;font-weight:900;flex:1}
h3{margin:22px 0 8px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn{background:var(--pri);color:#fff;border-radius:16px;padding:14px 22px;font-size:18px;box-shadow:0 4px 0 #4a2fc4;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a2fc4}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #13804d}
.btn.red{background:#d9443a;box-shadow:0 4px 0 #9b2a22}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 #b88700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 14px;font-size:15px;border-radius:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.profile{cursor:pointer;text-align:center;transition:transform .1s;position:relative}
.profile:hover{transform:translateY(-3px)}
.profile h2{margin:4px 0 2px;font-size:22px}
.profile .lock{position:absolute;top:12px;right:14px;font-size:18px}
.sub{color:var(--muted);font-size:15px}
.status{margin-top:8px;font-size:15px}
.status.done{color:var(--ok)}
.newhero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;border-style:dashed;color:var(--muted);font-size:20px}
.newhero b{font-size:56px;color:var(--pri)}
.hero svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.bar{height:14px;background:#f0eadf;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .4s}
.bar.gold > i{background:linear-gradient(90deg,#f5b400,#ffd84d)}
.bar.hp > i{background:linear-gradient(90deg,#1fae6b,#5ad69a)}
.bar.mhp > i{background:linear-gradient(90deg,#d9443a,#f27a6f)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stat{background:#faf6ef;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:17px;white-space:nowrap}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.testbanner{background:#e7f6ff;border:2px dashed #5aa9e6;color:#1d5f91;border-radius:16px;padding:10px 14px;margin-bottom:12px}
/* practice */
.prob{font-size:clamp(36px,8.5vw,60px);font-weight:900;text-align:center;margin:14px 0 6px;letter-spacing:1px;line-height:1.25}
.prob.mid{font-size:clamp(24px,5.5vw,38px);line-height:1.35}
.prob.word{font-size:clamp(20px,4.5vw,28px);font-weight:800;line-height:1.4;text-align:left}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.6em;line-height:1;margin:0 4px}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.ansrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ans{font-family:inherit;font-weight:900;font-size:38px;width:180px;text-align:center;border:3px solid var(--line);border-radius:18px;padding:6px;background:#fff;color:var(--ink);outline:none}
.ans.sm{width:110px}
.ans.active{border-color:var(--pri);box-shadow:0 0 0 4px #e6e0ff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:12px auto 0}
.pad button{font-size:26px;padding:12px 0;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .go{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 0 #13804d}
.cmpbtns{display:flex;justify-content:center;gap:14px;margin-top:10px}
.cmpbtns button{font-size:42px;width:92px;height:92px;border-radius:22px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;background:#ece4d6;display:block}
.dots i.c{background:var(--ok)} .dots i.h{background:#9ad7b6} .dots i.w{background:var(--bad)} .dots i.cur{outline:3px solid var(--pri);outline-offset:1px}
.fb{min-height:34px;text-align:center;font-size:21px;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
/* gear */
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.slot{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.slot h4{margin:0;font-size:16px;display:flex;justify-content:space-between}
.slot .eqd{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#faf6ef;border-radius:12px;padding:6px 10px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.new{animation:glow 1.2s infinite;border-color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 0 5px #ffe28a}}
.buy{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
/* map & battle */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;cursor:pointer;position:relative}
.mcard svg{width:100%;max-width:130px;height:auto}
.mcard.locked{cursor:default;background:#f3efe8}
.mcard.locked svg{filter:brightness(0) opacity(.25)}
.mcard.beaten{border-color:#9ad7b6;background:#f2fbf6}
.mcard.next{border-color:var(--pri);box-shadow:0 0 0 4px #e6e0ff}
.mcard .num{position:absolute;top:8px;left:10px;font-size:13px;color:var(--muted)}
.mcard .badge{position:absolute;top:6px;right:8px;font-size:20px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;background:linear-gradient(#e9f4ff,#fdf6e8);border:2px solid var(--line);border-radius:22px;padding:12px}
.fighter{position:relative;text-align:center}
.fighter svg{width:100%;max-width:200px;height:auto}
.fighter .nm{font-size:16px;margin-top:4px}
.vs{font-size:34px;font-weight:900;color:var(--muted);align-self:center}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#d9443a;animation:up 1s forwards;pointer-events:none;text-shadow:0 2px 0 #fff}
.dmg.miss{color:#7a7090}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.hitme{animation:shake .4s}
.lunge{animation:lunge .4s}
@keyframes lunge{50%{transform:translateX(30px)}}
.lungeL{animation:lungeL .4s}
@keyframes lungeL{50%{transform:translateX(-30px)}}
.analysis{border-radius:16px;padding:12px 14px;font-size:17px;margin-top:10px}
.analysis.good{background:#e9f8f0;color:#13804d}
.analysis.tight{background:#fff6dc;color:#8a6200}
.analysis.bad{background:#fdecec;color:#a8322a}
/* parent */
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{font-family:inherit;font-weight:700;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;padding:3px 0}
.chk input{width:20px;height:20px}
.tabs{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:15px;color:var(--ink)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
table.hist{width:100%;border-collapse:collapse;font-size:15px}
table.hist td,table.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.reward{background:linear-gradient(135deg,#fff3c4,#ffe08a);border:3px solid #f5c842;border-radius:22px;padding:20px;text-align:center}
.reward h2{margin:4px 0;font-size:28px}
.fame{width:100%;border-collapse:collapse;font-size:16px}
.fame td{padding:7px 8px;border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(30,20,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.conf{position:fixed;top:-20px;font-size:28px;z-index:70;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.syncnote{font-size:13px;color:var(--muted);text-align:center;margin-top:20px}
.colors button{width:36px;height:36px;border-radius:50%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ============ Utility ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const s = String(Math.abs(n)); const r = s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n<0?'−':'') + r; };
function todayKey(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayDiff(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5); }
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let R = Math.random;
const ri = (a,b) => a + Math.floor(R()*(b-a+1));
const pick = arr => arr[Math.floor(R()*arr.length)];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function confetti(n=40){ const em=['🎉','⭐','✨','🏆','💎','🎈']; for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='conf'; s.textContent=em[Math.floor(Math.random()*em.length)]; s.style.left=Math.random()*100+'vw'; s.style.animationDelay=(Math.random()*0.8)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3200);} }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
/* ============ Problem generators ============ */
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const NAMES = [['Tonda',0],['Ema',1],['Kuba',0],['Bára',1],['Matěj',0],['Anička',1],['Vojta',0],['Klárka',1]];

const CATS = {
  // ---- 1. třída ----
  add10: {grade:1, label:'Sčítání a odčítání do 10', gen(){
    const a=ri(1,9), b=ri(1,10-a); return R()<.5 ? {q:`${a} + ${b}`, a:a+b} : {q:`${a+b} − ${b}`, a:a};
  }},
  add20nb: {grade:1, label:'Do 20 bez přechodu přes desítku', gen(){
    const u=ri(1,8), v=ri(1,9-u);
    return R()<.5 ? {q:`1${u} + ${v}`, a:10+u+v} : {q:`1${u+v} − ${v}`, a:10+u};
  }},
  missing10: {grade:1, label:'Doplň číslo do 10', gen(){
    const a=ri(1,9), c=ri(a+1,10); return R()<.5 ? {q:`${a} + <u>&nbsp;?&nbsp;</u> = ${c}`, a:c-a} : {q:`<u>&nbsp;?&nbsp;</u> + ${c-a} = ${c}`, a:a};
  }},
  compare20: {grade:1, label:'Porovnávání do 20', gen(){
    const lv=ri(0,20), rv=R()<.2?lv:ri(0,20); const useSum=R()<.4 && lv>=2;
    const l = useSum ? (()=>{const x=ri(1,lv-1); return `${x} + ${lv-x}`;})() : lv;
    return {q:`${l} &nbsp;◯&nbsp; ${rv}`, type:'cmp', a: lv<rv?'<':lv>rv?'>':'='};
  }},
  word1: {grade:1, label:'Slovní úlohy (do 20)', word:true, gen(){
    const [n,f]=pick(NAMES), x=f?'a':'', k=ri(0,1);
    if(k===0){ const a=ri(2,9), b=ri(1,9); return {q:`${n} měl${x} ${a} pastelek a dostal${x} ještě ${b}. Kolik pastelek má teď?`, a:a+b}; }
    const a=ri(8,18), b=ri(1,7); return {q:`Na stromě sedělo ${a} ptáčků. ${b} odletělo. Kolik ptáčků zůstalo na stromě?`, a:a-b};
  }},
  // ---- 2. třída ----
  add20:   {grade:2, label:'Sčítání a odčítání do 20 (s přechodem)', gen(){
    const a=ri(3,9), b=ri(11-a,9), c=a+b;
    return R()<.5 ? {q:`${a} + ${b}`, a:c} : {q:`${c} − ${a}`, a:b};
  }},
  addsub100: {grade:2, label:'Sčítání a odčítání do 100', gen(){
    const k=ri(0,4);
    if(k===0){ const a=ri(12,89), b=ri(2,9); if(a+b<=100) return {q:`${a} + ${b}`, a:a+b}; return {q:`${a} − ${b}`, a:a-b}; }
    if(k===1){ const a=ri(21,95), b=ri(2,9); return {q:`${a} − ${b}`, a:a-b}; }
    if(k===2){ const a=ri(11,69), b=ri(1,3)*10; return R()<.5?{q:`${a} + ${b}`, a:a+b}:{q:`${a+b} − ${b}`, a:a}; }
    if(k===3){ const a=ri(11,59), b=ri(11,99-a); return {q:`${a} + ${b}`, a:a+b}; }
    const a=ri(40,99), b=ri(11,a-10); return {q:`${a} − ${b}`, a:a-b};
  }},
  mul2: {grade:2, label:'Malá násobilka 2, 3, 4, 5, 10 a dělení', gen(){
    const m=pick([2,3,4,5,10,2,3,4,5]), n=ri(1,10);
    return R()<.65 ? (R()<.5?{q:`${m} · ${n}`, a:m*n}:{q:`${n} · ${m}`, a:m*n}) : {q:`${m*n} : ${m}`, a:n};
  }},
  missing: {grade:2, label:'Doplň chybějící číslo', gen(){
    const k=ri(0,2);
    if(k===0){ const a=ri(3,9), b=ri(11-a,9); return {q:`<u>&nbsp;?&nbsp;</u> + ${b} = ${a+b}`, a:a}; }
    if(k===1){ const a=ri(20,80), b=ri(3,19); return {q:`${a} + <u>&nbsp;?&nbsp;</u> = ${a+b}`, a:b}; }
    const a=ri(30,90), b=ri(3,25); return {q:`${a} − <u>&nbsp;?&nbsp;</u> = ${a-b}`, a:b};
  }},
  compare: {grade:2, label:'Porovnávání (<, >, =)', gen(){
    const k=ri(0,2); let l,r,lv,rv;
    if(k===0){ lv=ri(10,99); rv=R()<.15?lv:ri(10,99); l=lv; r=rv; }
    else if(k===1){ const a=ri(3,9), b=ri(3,9); lv=a+b; rv=R()<.3?lv:ri(lv-3,lv+3); l=`${a} + ${b}`; r=rv; }
    else { const a=ri(20,60), b=ri(5,30); lv=a+b; const c=ri(20,60); const d=lv-c; if(d>0&&d<40&&R()<.4){rv=lv; r=`${c} + ${d}`;} else {rv=ri(lv-8,lv+8); r=rv;} l=`${a} + ${b}`; }
    return {q:`${l} &nbsp;◯&nbsp; ${r}`, type:'cmp', a: lv<rv?'<':lv>rv?'>':'='};
  }},
  word2: {grade:2, label:'Slovní úlohy (jednoduché)', word:true, gen(){
    const [n,f]=pick(NAMES), k=ri(0,3), x=f?'a':'';
    if(k===0){ const a=ri(12,40), b=ri(5,20); return {q:`${n} měl${x} ${a} kuliček a dostal${x} dalších ${b}. Kolik kuliček má teď?`, a:a+b}; }
    if(k===1){ const a=ri(25,60), b=ri(6,20); return {q:`V autobuse sedělo ${a} lidí. Na zastávce ${b} vystoupilo. Kolik lidí zůstalo v autobuse?`, a:a-b}; }
    if(k===2){ const m=pick([2,3,4,5]), n2=ri(2,8); return {q:`Na stole je ${n2} talířů a na každém leží ${m} jablka. Kolik jablek je dohromady?`.replace(' jablka',m===5?' jablek':' jablka'), a:m*n2}; }
    const m=pick([2,3,4,5]), n2=ri(2,8); return {q:`${m*n2} bonbónů rozdělíme spravedlivě mezi ${m} děti. Kolik bonbónů dostane každé dítě?`, a:n2};
  }},
  // ---- 4. třída ----
  mulall: {grade:4, label:'Celá násobilka a dělení', gen(){
    const m=ri(3,10), n=ri(2,10);
    return R()<.55 ? {q:`${m} · ${n}`, a:m*n} : {q:`${m*n} : ${n}`, a:m};
  }},
  rem: {grade:4, label:'Dělení se zbytkem', gen(){
    const d=ri(3,9), q=ri(2,9), r=ri(1,d-1);
    return {q:`${d*q+r} : ${d}`, type:'rem', a:[q,r]};
  }},
  big: {grade:4, label:'Sčítání a odčítání do 10 000 (zpaměti)', gen(){
    const k=ri(0,3);
    if(k===0){ const a=ri(12,75)*100, b=ri(3,24)*100; return {q:`${fmt(a)} + ${fmt(b)}`, a:a+b}; }
    if(k===1){ const a=ri(30,99)*100, b=ri(3,29)*100; return {q:`${fmt(a)} − ${fmt(b)}`, a:a-b}; }
    if(k===2){ const a=ri(1000,8999), b=ri(1,9)*(R()<.5?10:100); return R()<.5?{q:`${fmt(a)} + ${fmt(b)}`, a:a+b}:{q:`${fmt(a+b)} − ${fmt(b)}`, a:a}; }
    const a=ri(120,890), b=ri(110,600); return {q:`${a} + ${b}`, a:a+b};
  }},
  mulext: {grade:4, label:'Násobení mimo obor násobilky', gen(){
    const k=ri(0,2);
    if(k===0){ const a=ri(2,9)*10, b=ri(2,9); return {q:`${a} · ${b}`, a:a*b}; }
    if(k===1){ const a=ri(2,9)*100, b=ri(2,9); return {q:`${a} · ${b}`, a:a*b}; }
    const a=ri(12,29), b=ri(2,5); return {q:`${a} · ${b}`, a:a*b};
  }},
  divext: {grade:4, label:'Dělení mimo obor násobilky', gen(){
    const k=ri(0,1);
    if(k===0){ const d=ri(2,9), q=ri(2,9)*10; return {q:`${fmt(d*q)} : ${d}`, a:q}; }
    const d=ri(2,4), q=ri(12,24); return {q:`${d*q} : ${d}`, a:q};
  }},

let EASY = true;
const EASY_GEN = {
  addsub100(){ const k=ri(0,2);
    if(k===0){ const a=ri(11,89), b=ri(2,9); const u=a%10; if(u+b<10) return {q:`${a} + ${b}`, a:a+b}; const s=Math.min(b,u||b); return {q:`${a} − ${s}`, a:a-s}; }

    if(k===1){ const box=ri(3,6), per=ri(4,8); return {q:`V ${box} krabicích je po ${per} kouscích čokolády. Kolik kousků je dohromady?`, a:box*per}; }
    const km=ri(2,9)*10, days=ri(2,4); return {q:`Cyklista ujede každý den ${km} km. Kolik kilometrů ujede za ${days} dny?`, a:km*days}; },

function genOne(c){ const g = (EASY && EASY_GEN[c]) ? EASY_GEN[c] : CATS[c].gen; return g.call(CATS[c]); }
const DEFAULT_CATS = {1:['add10','add20nb','missing10','compare20','word1'],
  2:['add20','addsub100','mul2','missing','compare','word2'],
  3:['addsub100','mulall','missing','compare','divext','word2'],
  4:['mulall','rem','big','mulext','divext','order','fractions','round','word4'],
  5:['mulall','rem','big','mulext','divext','order','fractions','round','word4']};
function catsOf(p){ let c=(p.cats&&p.cats.length)?p.cats.filter(x=>CATS[x]):(DEFAULT_CATS[p.grade]||DEFAULT_CATS[2]); return c.length?c:DEFAULT_CATS[2]; }
function battleProblem(p){
  R=Math.random; let cats=catsOf(p).filter(c=>!CATS[c].word); if(!cats.length) cats=['add20'];
  EASY = p.diff!=='normal';
  const blocked=new Set(p.seen||[]);
  let pr, c;
  for(let i=0;i<60;i++){ c=pick(cats); pr=genOne(c); if(!blocked.has(qKey(pr))) break; }
  pr.cat=c; pr.type=pr.type||'num'; remember(p,[pr]); return pr;
}

function genDaily(profile, dateKey, count=20){
  EASY = profile.diff!=='normal';
  R = mulberry(hashStr(profile.id + '|' + dateKey + '|' + (profile.cats||[]).join(',') + (EASY?'e':'')));
  let cats = catsOf(profile);
  // balanced deck: round-robin over shuffled categories, word problems max 3
  const out=[], seen=new Set(), blocked=new Set(profile.seen||[]); let guard=0, wordCount=0;
  let order=[];
  while(out.length<count && guard++<600){
    if(!order.length){ order=cats.slice(); for(let i=order.length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [order[i],order[j]]=[order[j],order[i]];} }
    const c=order.pop(), cat=CATS[c];
    if(cat.word && wordCount>=3) continue;
    const p=genOne(c); p.cat=c; p.type=p.type||'num'; if(cat.word) p.word=true;
    if(seen.has(p.q)) continue;
    if(blocked.has(qKey(p)) && guard<400) continue;
    seen.add(p.q);
    if(cat.word) wordCount++;
    out.push(p);
  }
  R = Math.random;
  remember(profile, out);
  return out;
}

function openChestFor(p){
  if(!p.chests || !p.chests.length) return null;
  const kind=p.chests.shift();
  p.owned=p.owned||{};
  const cands = SLOTS.filter(sl=>(p.owned[sl.id]||0) < sl.items.length);
  const itemChance = kind==='gold' ? 1 : 0.6;
  if(cands.length && Math.random()<itemChance){
    // cheapest next item out of 3 random slots – drops stay useful for the current stage
    const pool=cands.slice(), sample=[];
    for(let i=0;i<3&&pool.length;i++) sample.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    sample.sort((a,b)=>a.items[p.owned[a.id]||0][4]-b.items[p.owned[b.id]||0][4]);
    const sl=sample[0], t=(p.owned[sl.id]||0)+1; p.owned[sl.id]=t; p.newItem=sl.id+':'+t;
    return {kind, item:sl.items[t-1], slot:sl.name};
  }
  const pts=(kind==='gold'?60:20)+Math.floor(Math.random()*5)*10;
  p.points+=pts; return {kind, points:pts};
}

function migrate(p){
  if(!p) return p;
  if(p.owned===undefined || p.gear!==undefined){ p.owned={}; p.eq={}; p.xp=p.totalCorrect||0; p.beaten=0; delete p.gear; }
  if(!p.gender) p.gender='m';
  if(p.pin===undefined) p.pin='';
  if(p.reward===undefined) p.reward='';
  if(!p.created) p.created=1;
  if(!p.chests) p.chests=[];
  if((p.catsV||1)<2){ if(p.cats && p.cats.length){ const add=(NEW_CATS_V2[p.grade]||[]).filter(c=>!p.cats.includes(c)); p.cats=p.cats.concat(add); } p.catsV=2; }
  return p;
}

const BACKEND = (window.BACKEND_URL||'').trim();
const HAS_GAS = !!BACKEND;
async function gas(fn, arg){
  if(fn==='loadAll'){ const r=await fetch(BACKEND+'?t='+Date.now()); if(!r.ok) throw new Error(r.status); return r.json(); }
  const body = fn==='saveItems' ? {action:'save', items:arg} : {action:'log', result:arg};
  const r=await fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status); return r.json();
}
let writing=false, pendingWrite=false, saveTimer=null, syncState=HAS_GAS?'loading':'local';
const lastSent={};
function save(){
  S.savedAt=Date.now();
  saveLocal();
  if(!HAS_GAS) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
}
async function flush(){
  if(!HAS_GAS) return;
  if(writing){ pendingWrite=true; return; }
  writing=true;
  try{
    const items={};
    const sj=JSON.stringify(S.settings); if(lastSent.settings!==sj) items.settings=sj;
    for(const p of S.profiles){ const j=JSON.stringify(p); if(lastSent[p.id]!==j) items[p.id]=j; }
    if(Object.keys(items).length){ await gas('saveItems', items); Object.assign(lastSent, items); }
    syncState='cloud';
  }catch(e){ syncState='offline'; setTimeout(flush, 8000); }
  writing=false;
  if(pendingWrite){ pendingWrite=false; flush(); }
  updateSyncNote();
}
async function pull(rerender){
  if(!HAS_GAS || writing) return;
  try{
    const r = await gas('loadAll');
    if(r && r.settings){ S.settings=JSON.parse(r.settings); lastSent.settings=r.settings; const before=S.settings.ver; migrateSettings(); if(before!==S.settings.ver) setTimeout(flush,100); }
    for(const [id,j] of Object.entries((r&&r.profiles)||{})){
      const o=migrate(JSON.parse(j)); const i=S.profiles.findIndex(p=>p.id===id);
      if(i>=0) S.profiles[i]=o; else S.profiles.push(o);
      lastSent[id]=j;
    }
    saveLocal(); syncState='cloud';
    if(!r || !r.settings) flush();
    if(rerender) render();
  }catch(e){ syncState='offline'; }
  updateSyncNote();
}
function logResult(p, h){
  if(!HAS_GAS || isTest(p)) return;
  gas('logResult', {date:todayKey(), name:p.name, grade:p.grade, c:h.c, n:h.n, pts:h.pts,
    wrong:(h.wrongCats||[]).map(c=>CATS[c]?CATS[c].label:c).join(', ')}).catch(()=>{});
}

function ensureToday(p){
  const k=todayKey();
  if(!p.today || p.today.date!==k){
    p.today = {date:k, idx:0, tries:0, res:[], problems:genDaily(p,k,S.settings.perDay||20), done:false, pts:0, wrong:[]};
    save();

  return p.today;
}

function analysisHTML(p, mi){
  const a=analyze(p,mi), m=a.m, st=a.st;
  let cls, txt;
  if(a.spare>=2){ cls='good'; txt=`💪 Máš dobrou šanci! Potřebuješ <b>${a.hits}</b> správných odpovědí a vydržíš <b>${a.rounds}</b> ${plural(a.rounds,'ránu','rány','ran')}. Můžeš udělat až ${a.spare} ${plural(a.spare,'chybu','chyby','chyb')}.`; }
  else if(a.spare>=0){ cls='tight'; txt = a.spare===0 ? `😬 Bude to hodně těsné – nesmíš udělat ani jednu chybu! (${a.hits} zásahů, vydržíš ${a.rounds} ${plural(a.rounds,'ránu','rány','ran')})` : `😬 Těsné! Můžeš udělat jen 1 chybu. (${a.hits} zásahů, vydržíš ${a.rounds} ${plural(a.rounds,'ránu','rány','ran')})`; }
  else {
    cls='bad';
    const atkNeed=Math.ceil(m.hp/a.rounds)+m.def;
    txt=`⛔ Na tuhle obludu jsi zatím ${G(p,'slabý','slabá')}. Potřebuješ ${a.hits} zásahů, ale vydržíš jen ${a.rounds} ${plural(a.rounds,'ránu','rány','ran')} – nevyhraješ ani bez chyby.`;
    if(st.atk<=m.def) txt+=`<br>Tvoje zbraň jí vůbec neublíží! Potřebuješ útok vyšší než ${m.def}.`;
    else txt+=`<br>Pomůže silnější zbraň (útok aspoň ${atkNeed}, teď máš ${st.atk}), nebo lepší brnění, štít a helma, abys vydržel${G(p,'','a')} víc ran.`;
  }
  return `<div class="analysis ${cls}">${txt}</div><div class="sub" style="margin-top:8px">💡 Tip: ${m.tip}.</div>`;
}

/* ============ Interaction ============ */
function confirmBox(text, cb){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><p style="font-size:18px">${text}</p><div class="row" style="justify-content:center"><button class="btn" id="mok">Ano</button><button class="btn sec" id="mno">Zrušit</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mok').onclick=()=>{m.remove(); cb();};
  m.querySelector('#mno').onclick=()=>m.remove();
}
function pinBox(text, cb){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><p style="font-size:18px">${text}</p><input type="password" class="ans sm" id="mpin" inputmode="numeric" maxlength="4" autocomplete="off" style="margin:6px auto"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="mok">OK</button><button class="btn sec" id="mno">Zrušit</button></div></div>`;
  document.body.appendChild(m);
  const inp=m.querySelector('#mpin'); inp.focus();
  const ok=()=>{ const v=inp.value; m.remove(); cb(v); };
  m.querySelector('#mok').onclick=ok; inp.onkeydown=e=>{ if(e.key==='Enter') ok(); };
  m.querySelector('#mno').onclick=()=>m.remove();
}
function showChest(){
  const p=prof(view.pid); if(!p || !p.chests || !p.chests.length) return;
  const kind=p.chests[0];
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card center"><div id="chbox" style="max-width:220px;margin:0 auto" class="shake">${chestSVG(kind)}</div><p id="chtxt" style="font-size:20px">Otevírám…</p><div id="chbtn"></div></div>`;
  document.body.appendChild(m);
  const box=m.querySelector('#chbox'); let n=0;
  const iv=setInterval(()=>{ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); if(++n>=2) clearInterval(iv); },380);
  setTimeout(()=>{
    const r=openChestFor(p); save();
    box.innerHTML=chestSVG(kind,true);
    m.querySelector('#chtxt').innerHTML = r.item
      ? `<div style="font-size:26px">✨ ${r.item[0]} ✨</div><div class="muted">${r.slot} · ${itemStatText(r.item)}</div><p style="font-size:16px">Najdeš ho v batohu – klikni na něj a nasaď si ho!</p>`
      : `<div style="font-size:30px">⭐ +${r.points} bodů</div>`;
    m.querySelector('#chbtn').innerHTML=`<button class="btn ok">Super!</button>`;
    m.querySelector('#chbtn button').onclick=()=>{ m.remove(); render(); };
    confetti(r.kind==='gold'?50:25);
  }, 1200);
}
function openHero(id){
  const p=prof(id); if(!p) return;
  if(p.pin && !unlocked.has(p.id)){
    pinBox(`🔒 Zadej tajný kód pro ${esc(p.name)}`, v=>{ if(v===String(p.pin)){ unlock(p.id); go({name:'hero',pid:p.id}); } else toast('Špatný kód. Zeptej se rodičů, pokud ho nevíš.'); });
  } else go({name:'hero',pid:p.id});
}
function readDraft(){ if(!draft) return; const n=$('#c-name'), g=$('#c-grade'), pin=$('#c-pin'), r=$('#c-reward'); if(n) draft.name=n.value; if(g) draft.grade=+g.value; if(pin) draft.pin=pin.value.replace(/\D/g,''); if(r) draft.reward=r.value; }

function bind(){
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openHero(el.dataset.open));
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); act(el.dataset.act); });
  document.querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>buy(el.dataset.buy));
  document.querySelectorAll('[data-eq]').forEach(el=>el.onclick=()=>equip(...el.dataset.eq.split(':')));
  document.querySelectorAll('[data-sel]').forEach(el=>el.onclick=()=>{ view.sel=+el.dataset.sel; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('[data-chest]').forEach(el=>el.onclick=()=>showChest());
  document.querySelectorAll('[data-fight]').forEach(el=>el.onclick=()=>startBattle(+el.dataset.fight));
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{parentTab=el.dataset.tab; render();});
  document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{ const p=prof(parentHero); p.color=el.dataset.color; save(); render(); });
  document.querySelectorAll('[data-gender]').forEach(el=>el.onclick=()=>{ readDraft(); draft.gender=el.dataset.gender; render(); });
  document.querySelectorAll('[data-ccolor]').forEach(el=>el.onclick=()=>{ readDraft(); draft.color=el.dataset.ccolor; render(); });
  const psel=$('#p-sel'); if(psel) psel.onchange=()=>{ parentHero=psel.value; render(); };
  if(view.name==='play' || view.name==='battle'){
    document.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>key(el.dataset.k));
    document.querySelectorAll('[data-cmp]').forEach(el=>el.onclick=()=>submit(el.dataset.cmp));
    document.querySelectorAll('.ans').forEach(el=>{
      el.onfocus=()=>{ document.querySelectorAll('.ans').forEach(x=>x.classList.remove('active')); el.classList.add('active'); };
      el.oninput=()=>{ el.value=el.value.replace(/[^\d]/g,''); };
      el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); key('ok'); } };
    });
    const a1=$('#a1'); if(a1 && matchMedia('(pointer:fine)').matches) a1.focus();
  }
  if(view.name==='parent' && !parentOk){ const pin=$('#pin'); if(pin){ pin.focus(); pin.onkeydown=e=>{ if(e.key==='Enter') act('pinok'); }; } }
}

let busy=false;
function curProblem(){ if(view.name==='battle') return view.b.pr; const t=view.practice || prof(view.pid).today; return t && t.problems[t.idx]; }
function key(k){
  const pr=curProblem(); if(!pr || busy) return;
  if(k==='ok'){
    if(pr.type==='rem'){ const a=$('#a1').value, b=$('#a2').value; if(a===''||b===''){ (a===''?$('#a1'):$('#a2')).focus(); return;} submit([+a,+b]); }
    else { const v=$('#a1').value; if(v==='') return; submit(+v); }
    return;
  }
  const inp=document.querySelector('.ans.active') || $('#a1'); if(!inp) return;
  if(k==='del') inp.value=inp.value.slice(0,-1);
  else if(inp.value.length < (+inp.maxLength||6)) inp.value+=k;
}
function isCorrect(pr,val){ return pr.type==='rem' ? (val[0]===pr.a[0] && val[1]===pr.a[1]) : val===pr.a; }
function shownAnswer(pr){ return pr.type==='rem' ? `${pr.a[0]} zbytek ${pr.a[1]}` : pr.type==='cmp' ? pr.a : fmt(pr.a); }
function submit(val){ if(view.name==='battle') battleAnswer(val); else answer(val); }
function setFb(cls, html){ const fb=$('#fb'); if(fb){ fb.className='fb '+cls; fb.innerHTML=html; } }

/* ---- daily practice ---- */
function answer(val){
  if(busy) return;
  const p=prof(view.pid), t=view.practice || p.today, pr=t.problems[t.idx];
  const card=$('#pcard');
  if(isCorrect(pr,val)){
    const r = t.tries ? 1 : 2; t.res[t.idx]=r;
    const gain = r===2?10:4;
    p.xp=(p.xp||0)+1;
    p.points+=gain; t.pts+=gain; p.totalCorrect++;
    setFb('ok', pick(['Správně! 🎉','Výborně! ⭐','Paráda! 💪','Super! 🚀','Přesně tak! ✨']) + (gain?`  +${gain}`:''));
    card.classList.add('pop'); next(t, 650);
  } else if(!t.tries){
    t.tries=1; setFb('bad','Ještě jednou – zkus to znovu 🙂');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.querySelectorAll('.ans').forEach(i=>i.value=''); const a1=$('#a1'); if(a1){ document.querySelectorAll('.ans').forEach(x=>x.classList.remove('active')); a1.classList.add('active'); if(matchMedia('(pointer:fine)').matches) a1.focus(); }
    save();
  } else {
    t.res[t.idx]=0; setFb('bad', `Správně je <b>${shownAnswer(pr)}</b>. Příště to dáš!`);
    (t.wrong = t.wrong||[]).push({q:pr.q, a:shownAnswer(pr), cat:pr.cat});
    next(t, 2200);
  }
}
function next(t, delay){
  busy=true; save();
  setTimeout(()=>{ busy=false; t.idx++; t.tries=0;
    if(t.idx>=t.problems.length) finish(t); else { save(); render(); } }, delay);
}
function finish(t){
  const p=prof(view.pid);
  const correct=t.res.filter(r=>r>0).length, total=t.problems.length;
  const wrong=(t.wrong||[]).map(w=>`${w.q.replace(/<u>.*?<\/u>/,'?').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')} → ${w.a}`);
  const lvlBefore = view.lvlStart||0;
  if(view.practice){
    const base=t.pts, perfect=t.res.every(r=>r===2);
    p.points+=15; t.pts+=15;
    if(perfect){ p.chests=p.chests||[]; p.chests.push('wood'); }
    const k=todayKey(); p.history=p.history||{};
    const h=p.history[k]||{c:0,n:0,pts:0,wrongCats:[]};
    h.c+=correct; h.n+=total; h.pts+=t.pts; h.extra=(h.extra||0)+1; h.wrongCats=[...new Set([...(h.wrongCats||[]),...(t.wrong||[]).map(w=>w.cat)])];
    p.history[k]=h; p.extraSet=null; save();
    logResult(p, {c:correct, n:total, pts:t.pts, wrongCats:[...new Set((t.wrong||[]).map(w=>w.cat))]});
    confetti(perfect?40:20);
    view={name:'summary',pid:p.id,sum:{practice:true,correct,total,wrong,base,pts:t.pts,perfect,lvlUp:level(p)>lvlBefore}}; render(); return; }
  const base=t.pts; let bonus=30; const perfect=t.res.every(r=>r===2);
  if(perfect) bonus+=30;
  const k=todayKey();
  if(p.lastDone && dayDiff(p.lastDone,k)===1) p.streak++; else if(p.lastDone!==k) p.streak=1;
  p.lastDone=k;
  const streakBonus=p.streak>=3; if(streakBonus) bonus+=10;
  p.points+=bonus; t.pts+=bonus; t.done=true;
  p.chests=p.chests||[]; p.chests.push(perfect?'gold':'wood');
  p.history=p.history||{};
  p.history[k]={c:correct,n:total,pts:t.pts,wrongCats:[...new Set((t.wrong||[]).map(w=>w.cat))]};
  const hk=Object.keys(p.history).sort(); while(hk.length>90) delete p.history[hk.shift()];
  save(); logResult(p, p.history[k]); confetti(perfect?60:30);
  view={name:'summary',pid:p.id,sum:{correct,total,base,pts:t.pts,perfect,streakBonus,wrong,lvlUp:level(p)>lvlBefore}};
  render();
}

/* ---- gear ---- */
function buy(slot){
  const p=prof(view.pid); p.owned=p.owned||{}; const own=p.owned[slot]||0, sl=SLOTMAP[slot];
  if(own>=sl.items.length) return;
  const c=price(slot,own+1); if(p.points<c) return;
  p.points-=c; p.owned[slot]=own+1; p.newItem=slot+':'+(own+1); save();
  toast(`🎒 ${sl.items[own][0]} je v batohu! Klikni na ${G(p,'něj','něj')} a nasaď si ho.`);
  render();
}
function equip(slot, tier){
  const p=prof(view.pid); tier=+tier; p.eq=p.eq||{};
  if(p.eq[slot]===tier){ p.eq[slot]=0; toast(`Sundáno: ${SLOTMAP[slot].items[tier-1][0]}`); }
  else { p.eq[slot]=tier; toast(`Nasazeno: ${SLOTMAP[slot].items[tier-1][0]} ✨`); }
  if(p.newItem===slot+':'+tier) p.newItem=null;
  save(); render();
}

/* ---- battle ---- */
function startBattle(mi){
  const p=prof(view.pid); if(mi>p.beaten) return;
  const st=stats(p);
  go({name:'battle', pid:p.id, b:{mi, hp:st.hp, maxHp:st.hp, mhp:MONSTERS[mi].hp, round:1, hits:0, miss:0, pr:battleProblem(p)}});
}
function anim(id, cls){ const el=document.getElementById(id); if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function floatTxt(id, txt, cls=''){ const el=document.getElementById(id); if(!el) return; const d=document.createElement('div'); d.className='dmg '+cls; d.textContent=txt; el.appendChild(d); setTimeout(()=>d.remove(),1000); }
function updBars(){ const b=view.b, m=MONSTERS[b.mi];
  const h=$('#hhp'), mh=$('#mhp'); if(h) h.style.width=(b.hp/b.maxHp*100)+'%'; if(mh) mh.style.width=(b.mhp/m.hp*100)+'%';
  const ht=$('#hhpt'), mt=$('#mhpt'); if(ht) ht.textContent=`❤️ ${b.hp}/${b.maxHp}`; if(mt) mt.textContent=`❤️ ${b.mhp}/${m.hp}`; }
function battleAnswer(val){
  if(busy) return; busy=true;
  const b=view.b, p=prof(view.pid), st=stats(p), m=MONSTERS[b.mi], pr=b.pr;
  const ok=isCorrect(pr,val);
  document.querySelectorAll('.pad button,.cmpbtns button').forEach(x=>x.disabled=true);
  if(ok){
    p.xp=(p.xp||0)+1;
    const d=Math.max(1, st.atk-m.def); b.mhp=Math.max(0,b.mhp-d); b.hits++;
    setFb('ok', pick(['Zásah! ⚔️','Přesně! 💥','Bum! 💪','Trefa! ✨']));
    anim('fh','lunge'); setTimeout(()=>{ anim('fm','hitme'); floatTxt('fm','−'+d); updBars(); },200);
    if(b.mhp<=0){ setTimeout(()=>battleEnd(true),1200); return; }
  } else {
    b.miss++; setFb('bad', `Vedle! Správně bylo <b>${shownAnswer(pr)}</b>.`); floatTxt('fm','vedle','miss');
  }
  setTimeout(()=>{
    const md=Math.max(1, m.atk-st.def); b.hp=Math.max(0,b.hp-md);
    anim('fm','lungeL'); setTimeout(()=>{ anim('fh','hitme'); floatTxt('fh','−'+md); updBars(); },200);
    if(b.hp<=0){ setTimeout(()=>battleEnd(false),1200); return; }
    setTimeout(()=>{ b.round++; b.pr=battleProblem(p); busy=false; render(); }, 900);
  }, ok?900:1700);
}
function battleEnd(win){
  busy=false;
  const p=prof(view.pid), b=view.b;
  const first = win && b.mi===p.beaten;
  let gold=0;
  if(first){ p.beaten++; gold=bounty(b.mi); p.points+=gold; if(b.mi===9) p.rewardClaimed=false; p.chests=p.chests||[]; p.chests.push(b.mi===9?'gold':'wood'); }
  save();
  if(win) confetti(b.mi===9?100:35);
  view={name:'bend', pid:p.id, e:{win, mi:b.mi, first, gold, hits:b.hits, miss:b.miss, mhp:b.mhp}};
  render(); window.scrollTo(0,0);
}

/* ---- actions ---- */
function act(a){
  const p = view.pid ? prof(view.pid) : null;
  switch(a){
  case 'home': draft=null; go({name:'home'}); break;
  case 'parent': parentOk=false; go({name:'parent'}); break;
  case 'lock': parentOk=false; go({name:'home'}); break;
  case 'create': draft=null; go({name:'create'}); break;
  case 'createok': {
    readDraft(); const name=(draft.name||'').trim();
    if(!name){ toast('Napiš své jméno 🙂'); $('#c-name').focus(); return; }
    if(draft.pin && !/^\d{4}$/.test(draft.pin)){ toast('Tajný kód musí mít 4 číslice (nebo nech prázdné).'); return; }
    const np=newProfile({name, grade:draft.grade, gender:draft.gender, color:draft.color, pin:draft.pin, reward:(draft.reward||'').trim()});
    S.profiles.push(np); unlock(np.id); save(); draft=null;
    toast(`Vítej, ${np.name}! ⚔️`); go({name:'hero',pid:np.id}); break; }
  case 'hero': case 'back': go({name:'hero',pid:view.pid}); break;
  case 'map': go({name:'map',pid:view.pid, sel: p && p.beaten<10 ? p.beaten : null}); break;
  case 'flee': confirmBox('Opravdu utéct z boje? Obluda zůstane neporažená.', ()=>go({name:'map',pid:view.pid,sel:view.b.mi})); break;
  case 'play': {
    const t=ensureToday(p);
    if(t.done){ if(!p.extraSet || p.extraSet.date!==todayKey()){ p.extraSet={date:todayKey(),idx:0,tries:0,res:[],problems:genDaily(p,todayKey()+'-extra-'+Date.now(),S.settings.perDay||10),pts:0,wrong:[]}; save(); } go({name:'play',pid:p.id,practice:p.extraSet,lvlStart:level(p)}); }
    else go({name:'play',pid:p.id,lvlStart:level(p)});
    break; }
  // test tools
  case 't-pts': p.points+=500; save(); render(); break;
  case 't-lvl': p.xp=(p.xp||0)+(XP_PER_LEVEL[S.settings.length]||40); save(); render(); toast(`Úroveň ${level(p)}`); break;
  case 't-unlock': p.beaten=Math.max(p.beaten,9); save(); render(); toast('Odemčeno až po draka'); break;
  case 't-all': SLOTS.forEach(sl=>{ p.owned[sl.id]=sl.items.length; p.eq[sl.id]=sl.items.length; }); p.xp=Math.max(p.xp||0,(MAX_LEVEL-1)*(XP_PER_LEVEL[S.settings.length]||40)); save(); render(); break;
  case 't-chest': p.chests=p.chests||[]; p.chests.push(Math.random()<.3?'gold':'wood'); save(); render(); break;
  case 't-reset': confirmBox('Začít s testovacím hrdinou znovu?', ()=>{ const g=TEST.grade, s=TEST.gender; TEST=newProfile({id:'test',name:'Testovací '+(s==='f'?'hrdinka':'hrdina'),grade:g,gender:s,color:'#1fb5c9'}); saveLocal(); render(); }); break;
  case 't-new': { const g=+$('#t-grade').value, s=$('#t-gender').value; TEST=newProfile({id:'test',name:'Testovací '+(s==='f'?'hrdinka':'hrdina'),grade:g,gender:s,color:'#1fb5c9'}); saveLocal(); go({name:'hero',pid:'test'}); break; }
  case 't-open': go({name:'hero',pid:'test'}); break;
  // parent
  case 'pinok': { const v=$('#pin').value; if(v===String(S.settings.pin)){ parentOk=true; render(); } else { toast('Špatný PIN'); $('#pin').value=''; } break; }
  case 'savesettings':
    S.settings.reward=$('#s-reward').value.trim()||S.settings.reward;
    S.settings.length=$('#s-len').value;
    S.settings.perDay=Math.max(5,Math.min(40,parseInt($('#s-per').value)||20));
    { const np=$('#s-pin').value.trim(); if(np) S.settings.pin=np; }
    save(); toast('Uloženo ✓'); render(); break;
  case 'saveprofile': case 'defcats': case 'regen': {
    const h=prof(parentHero);
    h.name=$('#p-name').value.trim()||h.name;
    h.gender=$('#p-gender').value; h.diff=$('#p-diff').value;
    const pin=$('#p-pin').value.trim(); if(pin && !/^\d{4}$/.test(pin)){ toast('Kód musí mít 4 číslice'); return; } h.pin=pin;
    h.reward=$('#p-reward').value.trim();
    const g=+$('#p-grade').value;
    if(a==='defcats' || g!==h.grade){ h.grade=g; h.cats=DEFAULT_CATS[g].slice(); }
    else { h.cats=[...document.querySelectorAll('[data-cat]')].filter(x=>x.checked).map(x=>x.dataset.cat); if(!h.cats.length) h.cats=DEFAULT_CATS[h.grade].slice(); }
    if(a==='regen'){
      if(h.today && h.today.date===todayKey() && (h.today.done || h.today.idx>0)) toast('Dnešek už je rozpracovaný – změna platí od zítřka.');
      else { h.today=null; ensureToday(h); toast('Dnešní příklady vygenerovány znovu ✓'); }
    } else toast('Uloženo ✓');
    save(); render(); break; }
  case 'bonus': { const h=prof(parentHero); const v=parseInt($('#p-bonus').value)||0; h.points=Math.max(0,h.points+v); save(); toast(`${v>=0?'Připsáno':'Odečteno'} ${Math.abs(v)} bodů`); render(); break; }
  case 'claimed': { const h=prof(parentHero); h.rewardClaimed=true; save(); render(); break; }
  case 'newseason': { const h=prof(parentHero); confirmBox(`Začít novou výpravu pro ${esc(h.name)}? Body, výbava, úroveň i obludy se vynulují.`, ()=>{ Object.assign(h,{points:0,xp:0,owned:{},eq:{},beaten:0,rewardClaimed:false,newItem:null}); h.season=(h.season||1)+1; save(); render(); toast('Nová výprava začíná! 🚀'); }); break; }
  case 'delhero': { const h=prof(parentHero); confirmBox(`Opravdu smazat hrdinu ${esc(h.name)}? Tohle nejde vrátit.`, ()=>{ h.deleted=true; h.history={}; h.today=null; parentHero=null; save(); render(); toast('Smazáno'); }); break; }
  case 'copybk': { const v=$('#bk').value; try{ navigator.clipboard.writeText(v).then(()=>toast('Zkopírováno ✓'),()=>{ $('#bk').select(); toast('Označeno – zkopírujte Ctrl+C'); }); }catch(e){ $('#bk').select(); toast('Označeno – zkopírujte Ctrl+C'); } break; }
  case 'importbk': try{ const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim())))); if(!o.profiles) throw 0; confirmBox('Načíst zálohu? Současný postup se přepíše.', ()=>{ S=o; S.profiles.forEach(migrate); save(); toast('Záloha načtena ✓'); render(); }); }catch(e){ toast('Kód se nepodařilo načíst'); } break;
  }
}

render();
pull(true);
</script>
